server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Types que nginx ne connaît pas : servis en binaire opaque, ce qui
    # convient au téléchargement comme à fetch() pour le STL.
    types { text/html html; text/css css; application/javascript js;
            application/json json; application/pdf pdf;
            model/stl stl; application/dxf dxf; application/step step; }
    default_type application/octet-stream;

    # Le site est engendré : il est immuable entre deux déploiements.
    location /assets/   { expires 7d; add_header Cache-Control "public"; }
    location /fichiers/ { expires 7d; add_header Cache-Control "public"; }
    location /          { try_files $uri $uri/ $uri/index.html =404; }

    gzip on;
    gzip_types text/css application/javascript application/json model/stl application/dxf;
    gzip_min_length 1024;
}
