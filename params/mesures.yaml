# Les ACTES DE MESURE — voir decisions/archive/0041.
#
# CARTON : caractérisation arrêtée le 2026-09-30 — les mesures carton
# ci-dessous sont des valeurs d'apprentissage, conservées telles quelles.
#
# ─────────────────────────────────────────────────────────────────────────
#  CE FICHIER DÉCRIT DES MESURES, PAS DES VALEURS
# ─────────────────────────────────────────────────────────────────────────
#  Une entrée par grandeur DIRECTEMENT mesurée. Jamais pour une grandeur
#  dérivée : l'incertitude d'un quotient se CALCULE depuis celles de ses
#  membres, elle ne se déclare pas. La déclarer deux fois, c'est la faire
#  diverger (CLAUDE.md, « ce qui peut se calculer se calcule »).
#
#  `type_incertitude` :
#    resolution   le pas de l'instrument — demi-graduation par convention
#    dispersion   l'écart-type de n relevés répétés
#  Ce ne sont pas la même chose et elles ne se combinent pas pareil.
#
#  `n: 1` dit qu'un seul relevé a été fait, donc qu'aucun écart-type
#  n'existe. Le dire évite d'en inventer un.
#
#  Pour un produit ou un quotient, les incertitudes RELATIVES
#  s'additionnent en quadrature :
#      σ_rel(a/b) = racine( σ_rel(a)² + σ_rel(b)² )

# SUSPENSION LEVÉE LE 2026-09-29 — l'histoire est conservée.
#
#   Trois mesures ont été suspendues le 2026-09-29 : l'acte de mesure
#   n'était pas en cause, c'était L'OBJET MESURÉ qui n'était pas
#   identifié. `alimente:` pointait vers `carton_ondule_simple`, et le
#   carton était peut-être une double.
#
#   Il l'était. Profil confirmé à la tranche par Jeremy le même jour :
#   deux rangées d'arches, un papier intermédiaire, trois papiers plats.
#   Photo IMG_6597, hors dépôt. `alimente:` pointe désormais vers
#   `carton_ondule_double`.
#
#   CE QUE CET ÉPISODE A MONTRÉ, et que la fiche 0043 §3 a consigné :
#   une mesure porte la matière SUPPOSÉE, et rien dans le dépôt ne peut
#   vérifier la supposition. Ici la correction a été possible parce que
#   l'objet existait encore et qu'on pouvait le regarder. Ce ne sera pas
#   toujours le cas.

mesures:

  semelle_masse_2026_09_29:
    grandeur: "masse de la semelle d'apprentissage, pièce entière"
    valeur: 4.0
    unite: g
    incertitude: 0.5
    type_incertitude: resolution
    instrument: "balance de cuisine, affichage au gramme"
    n: 1
    date: 2026-09-29
    alimente: []            # ne nourrit plus rien : voir `remplacee_par`
    remplacee_par: panneau_masse_2026_09_29
    note: >
      PREMIÈRE MESURE PHYSIQUE DU PROJET. Conservée, jamais effacée.
      Remplacée le jour même par une pesée sur panneau plus grand, qui
      divise l'incertitude par cinq.
      Elle garde toute sa valeur de VÉRIFICATION : elle donnait
      635 g/m² à ±12,5 %, soit 556 à 714. La mesure qui la remplace donne
      649 g/m². **La première pesée tenait.** Deux mesures indépendantes
      concordantes valent mieux qu'une mesure précise seule.

  panneau_masse_2026_09_29:
    grandeur: "masse d'un panneau de carton ondulé, zone plate non écrasée"
    valeur: 20.0
    unite: g
    incertitude: 0.5
    type_incertitude: resolution
    instrument: "balance de cuisine, affichage au gramme"
    n: 1
    date: 2026-09-29
    alimente: [matieres.carton_ondule_double.masse_surfacique]
    note: >
      Panneau de 220 x 140 mm, relevé à la règle.
      ⚠ UNITÉ CORRIGÉE À LA LECTURE : le relevé disait « 22 x 14 mm ».
      En millimètres, 20 g sur 308 mm² donneraient 65 000 g/m² — un
      carton de 65 kg au mètre carré. Lu en centimètres, 649 g/m², à
      2 % de la mesure précédente. Le contexte tranche sans ambiguïté,
      mais la correction est consignée plutôt que faite en silence.

  panneau_dimensions_2026_09_29:
    grandeur: "dimensions du panneau pesé"
    valeur: 30800.0
    unite: mm2
    incertitude: 130.0
    type_incertitude: resolution
    instrument: "règle graduée, demi-graduation sur chaque côté"
    n: 1
    date: 2026-09-29
    alimente: [matieres.carton_ondule_double.masse_surfacique]
    note: >
      220 x 140 mm, ±0,5 mm par côté. L'aire porte 0,42 % d'incertitude
      relative — négligeable devant les 2,5 % de la masse.

  carton_ondule_double_epaisseur_2026_09_29:
    grandeur: "épaisseur du carton ondulé DOUBLE cannelure"
    valeur: 3.5
    unite: mm
    incertitude: 0.5
    type_incertitude: resolution
    instrument: "règle graduée"
    n: 1
    date: 2026-09-29
    alimente: [matieres.carton_ondule_double.epaisseur_mesuree]
    note: >
      Relevée EN PLUSIEURS ENDROITS, mais sans moyenne consignée : n=1 est
      donc prudent. Pas au pied à coulisse — ses becs écrasent les
      cannelures, et l'écrasement est irréversible.
      ⚠ L'incertitude de 0,5 mm est une HYPOTHÈSE : « à la règle » ne dit
      pas la graduation. À confirmer par Jeremy.

  semelle_saignee_2026_09_29:
    grandeur: "saignée du cutter sur carton ondulé"
    valeur: 0.0
    unite: mm
    incertitude: null
    type_incertitude: sous_resolution
    instrument: "superposition de la pièce coupée sur le plan papier"
    n: 1
    date: 2026-09-29
    alimente: [reglages.cutter_cartonondule_double.saignee]
    note: >
      Il ne s'agit pas d'un zéro mesuré mais d'un écart INDÉTECTABLE par
      le moyen employé. La fiche 0026 le prédisait : le Messerschneiden
      est une séparation sans copeau (DIN 8580, 3.1), donc sans matière
      enlevée. Prédiction VÉRIFIÉE sur l'objet.
      Une mesure fine — comparateur, ou empilement de n découpes —
      donnerait une borne supérieure au lieu d'un zéro.

# ═════════════════════════════════════════════════════════════════════════
#  INCERTITUDES PROPAGÉES, au 2026-09-29 — CALCULÉES, jamais saisies
# ═════════════════════════════════════════════════════════════════════════
#
#   masse surfacique = masse / aire       (pesée sur PANNEAU, retenue)
#     σ_rel(masse) = 0,5/20 = 2,50 %
#     σ_rel(aire)  = racine( (0,5/220)² + (0,5/140)² ) = 0,42 %
#     σ_rel        = racine( 2,50² + 0,42² ) = 2,54 %
#     -> 0,6494 ± 0,0165 mg/mm²   soit 649 ± 17 g/m²
#
#   densité = masse_surfacique / epaisseur_mesuree
#     σ_rel = racine( 2,54² + 14,29² ) = 14,51 %
#     -> 0,1855 ± 0,0269 mg/mm³   soit 186 ± 27 kg/m³
#
#   ⚠ CE QUE LA REPESÉE A CHANGÉ, ET CE QU'ELLE N'A PAS CHANGÉ
#
#     masse surfacique : 12,5 % -> 2,5 %, un facteur CINQ.
#     densité          : 19,0 % -> 14,5 %, presque rien.
#
#     Parce que la densité est DÉSORMAIS DOMINÉE PAR L'ÉPAISSEUR
#     (14,3 %), et non plus par la masse (2,5 %). Peser mieux
#     n'améliorera plus la densité : c'est la règle sur une matière
#     compressible qui la limite.
#
#     C'est ce que la quadrature dit et qu'aucune intuition ne donne :
#     le terme dominant décide, et il a CHANGÉ DE CÔTÉ entre les deux
#     pesées.
