      en_aw_6082_t6_mm: 13.5     # 3,0 mm est la borne entre 3,5 x e (1,5-3,0) et 4,5 x e (3,0-6,0) : la plus prudente, 4,5 x 3 (0064) -> R 5 : NE PASSE PAS
      en_aw_6061_t6_mm: null     # non lu : aucune fiche 6061 lue (metallservice.ch inaccessible)
      note: "fiche 6082 : une seule colonne de rayon pour l'état T6, lue comme 90° (le 180° n'y est pas donné). À confirmer sur la fiche en image."
    dfm_litterature:   # PROVISOIRE : remplacé par la valeur de l'opérateur CN dès qu'il la donne
      provenance: litterature
      statut: "valeurs « retenues par Jeremy » selon le prompt du 2026-10-02, sans ses mots : PROPOSÉ (CLAUDE.md, règle 7). Aucun contrôle ne les lit."
      regle: "la plus prudente des trois rapports (fiche 0064) ; rapports dans docs/sources/dfm-tole-*.md (params/sources.yaml : rapport_dfm_tole_claude, _grok, _chatgpt), secondaires et non vérifiés"
