# Cotes FIXES. Ne suivent jamais H : une vis M3 reste une vis M3 que le robot
# mesure 56 cm ou 1,70 m (règle 2). Toutes les valeurs sont en millimètres.
#
# ─────────────────────────────────────────────────────────────────────────
#  STRUCTURE À QUATRE TABLES — 2026-09-29, fiches 0026 et 0033
# ─────────────────────────────────────────────────────────────────────────
#  Jusqu'à cette date, une seule table `procedes` fondait machine et
#  matière en une clé : `cutter_carton`, `laser_contreplaque`. C'était
#  faux. Un laser coupe bois, acrylique, carton et cuir ; rien ne reliait
#  `laser_contreplaque` à `laser_acrylique`, pas même le fait qu'il
#  s'agisse du MÊME appareil, qu'on ne réserve qu'une fois.
#
#  Et le grain était trop grossier : laser + alu 2 mm n'est pas laser +
#  alu 6 mm.
#
#  Quatre tables, donc :
#
#    machines   l'appareil        — qui, où, piloté comment
#    procedes   le VERBE          — vocabulaire DIN 8580, aucun calcul
#    matieres   ce qu'on ACHÈTE   — matériau x forme x épaisseur
#    reglages   ce qu'on MESURE   — le croisement des trois
#
#  La clé composée est abandonnée. À six axes elle devenait illisible et
#  l'espace explosait (180 combinaisons pour 4 réellement instruites).
#  Chaque réglage porte un `id` ÉCRIT À LA MAIN : stable parce qu'écrit,
#  pas calculé depuis une position dans une liste.
#
#  L'ÉPAISSEUR EST UN CHAMP, PAS UNE CLÉ (fiche 0033). Elle crée une
#  mesure différente de la même chose, pas une chose différente. La mettre
#  dans la clé ne coûtait rien à origines.yaml — c'est ce qui la rendait
#  tentante — et coûtait la structure de nullites.yaml, dont deux règles
#  conditionnelles cessaient de pouvoir s'écrire au bon grain.
#
#  Rien n'est effacé : ce qui devient caduc est conservé en fin de
#  fichier, en commentaire, avec son motif.

# Réglage employé par défaut quand une pièce n'en impose pas.
reglage_defaut: cutter_cartonplume_5

# ═════════════════════════════════════════════════════════════════════════
#  MACHINES — l'appareil, indépendamment de ce qu'on y passe
# ═════════════════════════════════════════════════════════════════════════
machines:

  cutter_main:
    nom: "cutter à main"
    lieu: "sur place"
    pilotage: manuel
    note: >
      Le seul qui permette d'itérer dans la journée. C'est pour cela que
      la conception se fait au plus contraignant (CLAUDE.md).

  laser_fablab:
    nom: "laser CO2 de fablab"
    lieu: "fablab"
    pilotage: numerique
    puissance_W: null        # à relever sur la machine du fablab

  decoupe_operateur_cn:
    nom: null                # jet d'eau ? laser ? plasma ? À ÉTABLIR
    lieu: "chez un proche opérateur CN"
    pilotage: numerique
    note: >
      Le moyen exact n'est pas connu. Tant qu'il ne l'est pas, aucune
      pièce destinée à cette machine ne peut être finalisée.

# ═════════════════════════════════════════════════════════════════════════
#  PROCÉDÉS — le VERBE, vocabulaire DIN 8580:2022-12 (fiche 0026)
#
#  Ces entrées ne pilotent AUCUN calcul. Elles donnent un vocabulaire
#  stable et extérieur au projet, qui survivra à nos renommages.
#
#  La norme classe par ce qui arrive à la COHÉSION de la matière. Nos
#  procédés sont tous dans le groupe principal 3 (Trennen, cohésion
#  diminuée) ; c'est le sous-groupe qui les sépare — et il prédit quelque
#  chose que nous n'avions pas vu : voir `enleve_matiere`.
#
#  ⚠ La norme elle-même n'a pas été lue : elle est payante. Existence,
#  date, principe et classement vérifiés sur sources secondaires.
# ═════════════════════════════════════════════════════════════════════════
procedes:

  messerschneiden:
    din: "3.1"
    famille: zerteilen
    nom_fr: "coupe au couteau"
    enleve_matiere: false
    note: >
      Zerteilen se définit comme la séparation SANS FORMATION DE COPEAU.
      La lame écarte la matière, elle ne l'enlève pas. Conséquence :
      la saignée est structurellement quasi nulle — ce n'est pas une
      inconnue du réglage, c'est une prédiction de la norme.

  abtragen_thermique:
    din: "3.4"
    famille: abtragen
    nom_fr: "enlèvement thermique"
    enleve_matiere: true
    note: >
      La matière part par le trait de coupe. La saignée existe toujours
      et croît avec l'épaisseur : elle est à mesurer par réglage.

  abtragen_jet:
    din: "3.4"
    famille: abtragen
    nom_fr: "enlèvement par jet"
    enleve_matiere: true

# ═════════════════════════════════════════════════════════════════════════
#  MATÉRIAUX — propriétés INTRINSÈQUES, indépendantes de l'épaisseur
# ═════════════════════════════════════════════════════════════════════════
materiaux:

  carton_plume:
    anisotrope: false        # mousse : isotrope dans le plan
    source: null

  carton_ondule:
    # `densite` a vécu ici jusqu'au 2026-09-29. Elle est DESCENDUE à la
    # matière : deux profils de cannelure n'ont pas la même densité
    # apparente, et la laisser au matériau la faisait valoir pour la
    # simple comme pour la double. Troisième erreur de localisation du
    # projet, après le verdict (0037) et le rayon (0042).
    #
    # Ce qui reste ici est ce qui vaut pour TOUT carton ondulé, quel que
    # soit son profil : l'anisotropie et le sens de référence.
    anisotrope: true
    axe_reference: "sens des cannelures"
    source: >
      Relevé le 2026-09-29 sur un panneau de 220 x 140 mm pesant 20 g,
      épaisseur 3,5 mm à la règle. Carton de récupération en DOUBLE
      cannelure, profil confirmé à la tranche le même jour. Une première
      pesée sur la semelle coupée (4 g / 6 300,49 mm²) donnait une
      valeur concordante.
    note_anisotropie: >
      Une cannelure est une suite d'arches collées entre deux papiers.
      Elle donne au panneau une direction FORTE (le long des arches) et
      une direction FAIBLE (en travers, où les arches s'écrasent et
      plient). Deux pièces découpées du MÊME DXF mais à 90° l'une de
      l'autre ne sont pas la même pièce.
    mesure_epaisseur: >
      Les becs d'un pied à coulisse ÉCRASENT les cannelures, et
      l'écrasement est IRRÉVERSIBLE : le point mesuré est perdu. Mesurer
      une pile de 10 feuilles sous pression légère et diviser, en
      changeant d'endroit à chaque relevé.

  contreplaque:
    anisotrope: true         # le fil des plis donne une direction
    source: null

  aluminium:
    anisotrope: false
    source: null

# ═════════════════════════════════════════════════════════════════════════
#  MATIÈRES — matériau x forme x épaisseur : CE QU'ON ACHÈTE
#
#  On n'achète pas « de l'aluminium », on achète une tôle de 3 mm ou une
#  barre de 20. La forme décide aussi QUELS PROCÉDÉS s'appliquent : on ne
#  découpe pas une barre au laser 2D. Elle appartient donc à la matière,
#  pas au procédé.
# ═════════════════════════════════════════════════════════════════════════
matieres:

  carton_plume_5:
    densite: null            # se déduira de masse_surfacique / epaisseur
    materiau: carton_plume
    forme: plaque
    epaisseur: 5.0
    epaisseur_mesuree: null
    masse_surfacique: null   # mg/mm2 — LA grandeur à mesurer

  carton_ondule_simple:
    densite: null            # aucune mesure : voir la note ci-dessous
    materiau: carton_ondule
    forme: plaque
    # AUCUNE MESURE. Les valeurs relevées le 2026-09-29 appartenaient à
    # `carton_ondule_double` : le carton mesuré était une double
    # cannelure, confirmé à la tranche le jour même. Elles ont été
    # déplacées, pas copiées — une simple cannelure reste à mesurer.
    epaisseur: null
    epaisseur_mesuree: null
    masse_surfacique: null
    note: >
      Matière conservée bien qu'elle n'ait jamais été mesurée : une
      simple cannelure est bien une matière du projet, distincte de la
      double (fiche 0043 §1). Son absence de valeurs est un trou
      déclaré, pas un oubli.

  carton_ondule_double:
    materiau: carton_ondule
    forme: plaque
    # ══════════════════════════════════════════════════════════════
    #  MESURES DU 2026-09-29 — SUSPENSION LEVÉE LE 2026-09-29
    # ══════════════════════════════════════════════════════════════
    #  Ces valeurs ont été relevées le 2026-09-29 et inscrites d'abord
    #  sous `carton_ondule_simple`, puis SUSPENDUES le même jour : le
    #  profil de cannelure n'était pas confirmé, et rien dans le dépôt
    #  ne pouvait dire ce qui avait été sur l'établi (fiche 0043 §3).
    #
    #  LEVÉE le 2026-09-29, sur observation directe de la tranche par
    #  Jeremy : DEUX rangées d'arches séparées par un papier
    #  intermédiaire, trois papiers plats au total. Photo IMG_6597,
    #  hors dépôt. C'est un constat binaire, visible à l'œil, qui ne
    #  dépend d'aucune fourchette de grammage — le dépôt n'en possède
    #  aucune et n'en inscrira pas (fiche 0028).
    #
    #  LE COUPLE EXACT N'EST PAS IDENTIFIÉ. E+E, E+B ou autre : rien ne
    #  permet de trancher, et rien n'est inscrit à ce sujet.
    #
    #  CE QUE LA LEVÉE NE LÈVE PAS :
    #    - l'incertitude de ±14,3 % sur l'épaisseur, mesurée à la règle
    #      sur une matière compressible ;
    #    - le caractère de BORNE HAUTE de la densité : la zone mesurée a
    #      pu être empilée, donc comprimée. L'écrasement ne change ni la
    #      masse ni l'aire, donc pas la masse surfacique — mais il réduit
    #      l'épaisseur, donc il gonfle la densité.
    # ══════════════════════════════════════════════════════════════
    epaisseur: 3.5           # mm — ±0,5 (14,3 %). À REMESURER sans
                             # contact, sur zone jamais empilée.
    epaisseur_mesuree: 3.5   # mm, à la RÈGLE, en plusieurs endroits.
                             # Pas au pied à coulisse : ses becs écrasent
                             # les cannelures, et l'écrasement est
                             # irréversible (protocole du 2026-09-28).
    masse_surfacique: 0.6494 # mg/mm² = 649 g/m², ±2,5 %.
                             # Panneau de 20 g sur 220 x 140 mm.
                             # La première pesée (635 g/m² ±12,5 %, sur la
                             # semelle coupée) tenait : 649 tombe dans son
                             # intervalle 556-714. Deux mesures
                             # indépendantes concordantes.
    # DÉDUITE, jamais saisie : masse_surfacique / epaisseur_mesuree
    # (fiche 0020). 0,6494 / 3,5 = 0,1855 mg/mm³ = 186 kg/m³.
    # ⚠ BORNE HAUTE : si le carton est comprimé, l'épaisseur est
    #   sous-estimée et la densité surestimée.
    # ⚠ ±14,5 %, hérité surtout de l'ÉPAISSEUR (14,3 %) et non plus de
    #   la masse (2,5 %) : peser mieux n'améliorera plus cette valeur.
    densite: 0.1855          # mg/mm³

  contreplaque_3:
    densite: null            # se déduira de masse_surfacique / epaisseur
    materiau: contreplaque
    forme: plaque
    epaisseur: 3.0
    epaisseur_mesuree: null
    masse_surfacique: null

  alu_tole_3:
    densite: null            # se déduira de masse_surfacique / epaisseur
    materiau: aluminium
    forme: tole
    epaisseur: 3.0
    epaisseur_mesuree: null
    masse_surfacique: null

# ═════════════════════════════════════════════════════════════════════════
#  RÉGLAGES — le croisement machine x procédé x matière, et LES MESURES
#
#  Liste, pas dictionnaire : chaque entrée porte son `id`, écrit à la
#  main. Le chargeur (scripts/procedes.py) en fait un dictionnaire, et les
#  motifs de origines.yaml et nullites.yaml s'écrivent
#  `reglages.<id>.saignee` — stables, puisque l'id ne dépend d'aucune
#  position.
#
#  TROIS ÉTATS DE VALIDITÉ, jamais deux (fiche 0021, conservée) :
#    absent de la liste          -> pas encore instruit
#    valide: false + motif       -> impossible, et on sait pourquoi
#    valide: true, cotes nulles  -> possible, à mesurer
# ═════════════════════════════════════════════════════════════════════════
reglages:

  - id: cutter_cartonplume_5
    machine: cutter_main
    procede: messerschneiden
    matiere: carton_plume_5
    valide: true
    saignee: null            # à MESURER — voir le procédé : prédite quasi nulle
    rayon_interieur_min: 2.5 # = 0,5 x epaisseur (CLAUDE.md)
    voile_min: null          # à MESURER — le carton se déchire
    fixation: "vis traversante + rondelles larges des deux côtés"
    source_saignee: null

  # Renommé le 2026-09-29 : la matière effectivement coupée était une
  # DOUBLE cannelure. L'ancien id `cutter_cartonondule` désignait une
  # matière qu'on n'avait pas eue en main.
  - id: cutter_cartonondule_double
    machine: cutter_main
    procede: messerschneiden
    matiere: carton_ondule_double
    valide: true
    # ── MESURÉ LE 2026-09-29 ────────────────────────────────────────
    # La fiche 0026 PRÉDISAIT cette valeur : le Messerschneiden est une
    # séparation sans copeau (DIN 8580, 3.1), donc sans matière enlevée.
    # Prédiction vérifiée sur l'objet. Voir fiche 0026 § Résultat.
    saignee: 0.0             # mm — quasi nulle, lame fine de cutter.
                             # 0,0 est la valeur RETENUE, pas une mesure
                             # au micron : sous la résolution du moyen.
    source_saignee: >
      Relevé sur la semelle d'apprentissage, 2026-09-29. Lame fine de
      cutter, 1 passe sauf les angles à 2. Superposition de la pièce
      coupée sur le plan papier : coïncide.
    rayon_interieur_min: 1.75 # = 0,5 x 3,5 mm (CLAUDE.md). ⚠ Hérite de
                              # l'incertitude de l'épaisseur : ±14,3 %.
                              # Et ne dit que ce que la MATIÈRE supporte,
                              # pas ce que le GESTE permet (fiche 0042) :
                              # R 2,5 a déjà été difficile à la main.
    voile_min: null          # toujours à mesurer : aucune bande étroite
                             # sur cette pièce, elle ne s'interface avec rien
    fixation: "vis traversante + rondelles larges des deux côtés"

  - id: laser_contreplaque_3
    machine: laser_fablab
    procede: abtragen_thermique
    matiere: contreplaque_3
    valide: true
    saignee: null            # ordre de grandeur attendu 0,1 à 0,3
    rayon_interieur_min: 1.5
    voile_min: null
    fixation: "vis traversante + écrou"
    source_saignee: null

  - id: operateur_cn_alu_3
    machine: decoupe_operateur_cn
    procede: abtragen_jet
    matiere: alu_tole_3
    valide: true
    saignee: null            # varie de 0,2 à 1,5 selon le moyen
    rayon_interieur_min: null # dépend du moyen, donc de `machines.decoupe_operateur_cn.nom`
    voile_min: null
    fixation: "vis traversante + écrou, taraudage possible"
    source_saignee: null

  # ── Réglages IMPOSSIBLES, déclarés comme tels ──────────────────────
  # Sans ces lignes, leur absence se lirait « pas encore instruit ».
  - id: cutter_alu_3
    machine: cutter_main
    procede: messerschneiden
    matiere: alu_tole_3
    valide: false
    motif: >
      un cutter à main ne coupe pas une tôle d'aluminium de 3 mm. Ce
      n'est pas une valeur qui manque : le réglage n'existe pas.

  - id: laser_alu_3
    machine: laser_fablab
    procede: abtragen_thermique
    matiere: alu_tole_3
    valide: false
    motif: >
      un laser CO2 de fablab ne coupe pas l'aluminium : le métal réfléchit
      l'infrarouge lointain au lieu de l'absorber. Il faudrait un laser
      fibre, que le fablab n'a pas.

# ═════════════════════════════════════════════════════════════════════════
#  QUINCAILLERIE — inchangée, nature `interface` (règle 2)
# ═════════════════════════════════════════════════════════════════════════
vis:
  M2:  { diametre: 2.0, passage: 2.4, tete_diametre: 3.8 }
  M3:  { diametre: 3.0, passage: 3.4, tete_diametre: 5.5 }
  M4:  { diametre: 4.0, passage: 4.5, tete_diametre: 7.0 }

roulements:
  MR85:  { interieur: 5,  exterieur: 8,  largeur: 2.5 }
  "623": { interieur: 3,  exterieur: 10, largeur: 4 }
  "688": { interieur: 8,  exterieur: 16, largeur: 5 }

# Actionneurs — à compléter une fois le modèle retenu et mesuré.
# Ne rien inventer ici : les cotes viennent de la fiche constructeur.
actionneurs:
  P1:
    modele: null                 # TODO
    couple_nominal_Nm: null
    entraxe_fixation: null

# ═════════════════════════════════════════════════════════════════════════
#  CADUC — conservé, jamais effacé
# ═════════════════════════════════════════════════════════════════════════
#
#  ── Au 2026-09-29, remplacé par les quatre tables (fiches 0026, 0033) ──
#
#  procede_defaut: cutter_carton
#  procedes:
#    cutter_carton:        { machine: "cutter à main", lieu: "sur place",
#                            materiau: carton_plume, epaisseur: 5.0, ... }
#    cutter_carton_ondule: { ... }
#    laser_contreplaque:   { ... }
#    decoupe_metal:        { ... }
#        MOTIF : la clé fondait machine et matière. Un laser coupe
#        plusieurs matières, et rien ne reliait deux de ses entrées.
#        Le grain était aussi trop grossier : alu 2 mm et alu 6 mm
#        partageaient une seule ligne.
#        CORRESPONDANCE avec la nouvelle structure :
#          cutter_carton        -> reglages.cutter_cartonplume_5
#          cutter_carton_ondule -> reglages.cutter_cartonondule_double
#          laser_contreplaque   -> reglages.laser_contreplaque_3
#          decoupe_metal        -> reglages.operateur_cn_alu_3
#
#  materiaux.*.epaisseur_nominale
#        MOTIF : une épaisseur n'est pas une propriété du MATÉRIAU mais de
#        la MATIÈRE achetée. Déplacée sous `matieres.*.epaisseur`.
#
#  ── Au 2026-09-28, il n'y a pas d'imprimante 3D (fiche 0014) ──
#  Redevient valable le jour où une imprimante est acquise ET vérifiée.
#  Aucune imprimante vérifiée au 2026-10-01 (fiche 0059). L'outillage relève
#  de la seule décision de Jeremy (fiche 0066, b). Corrigé à la refonte R5 :
#  ce commentaire disait « Jeremy en achète une cette semaine (fiche 0027) ».
#
#  vis:
#    M2:  { insert_diametre: 3.2, insert_profondeur: 4.0 }
#    M3:  { insert_diametre: 4.6, insert_profondeur: 5.7 }
#    M4:  { insert_diametre: 5.6, insert_profondeur: 8.1 }
#        MOTIF : cotes de logement d'insert à chaud, qui se pose dans du
#        thermoplastique imprimé. Ni le contreplaqué, ni le carton, ni
#        l'aluminium n'en acceptent.
#        RÉSERVE : ces valeurs n'ont jamais eu de référence constructeur
#        (audit du 2026-09-28). À resourcer avant tout usage.
#
#  tolerances:
#    impression_3d: { jeu_glissant: 0.20, jeu_serre: 0.05,
#                     logement_roulement: 0.00 }
#        MOTIF : jeux propres au retrait d'une pièce imprimée au
#        refroidissement. Sans objet pour une pièce découpée.
#
#  epaisseurs:
#    paroi_minimale_impression: 1.6
#        MOTIF : fonction du diamètre de buse. Sans objet : pas de buse.
#
#  tolerances:
#    decoupe_jet_eau: { profil: 0.10 }
#        MOTIF : déplacée puis remise à null — rien ne dit que le moyen d'un
#        proche opérateur CN soit un jet d'eau. La valeur 0,10 n'était sourcée nulle part.
