# Cotes FIXES. Ne suivent jamais H : une vis M3 reste une vis M3 que le robot
# mesure 56 cm ou 1,70 m (règle 2). Toutes les valeurs sont en millimètres.
#
# ─────────────────────────────────────────────────────────────────────────
#  HIÉRARCHIE INVERSÉE LE 2026-09-28 (fiches 0014 et 0015)
# ─────────────────────────────────────────────────────────────────────────
#  Jusqu'à cette date le fichier supposait l'IMPRESSION 3D comme procédé
#  principal et la découpe comme appoint. Il n'y a pas d'imprimante.
#  C'est l'inverse : la DÉCOUPE 2D est le procédé, l'impression une
#  possibilité future.
#
#  Rien n'a été effacé : ce qui devient caduc est conservé plus bas, en
#  commentaire, avec son motif. Une valeur retirée en silence est une
#  information perdue, et rien ne signalerait qu'elle redevient valable.

# ═════════════════════════════════════════════════════════════════════════
#  PROCÉDÉS — par couple MACHINE × MATÉRIAU, jamais par procédé générique
#  Nature `procede` (fiche 0013). Ces valeurs ne dérivent pas de H.
# ═════════════════════════════════════════════════════════════════════════
# Procédé employé par défaut quand une pièce n'en impose pas. Le changer
# est une modification de DONNÉE, pas de code : bascule de matériau sans
# toucher à une ligne de Python.
procede_defaut: cutter_carton

procedes:

  cutter_carton:
    machine: "cutter à main"
    lieu: "sur place"
    materiau: carton_plume
    epaisseur: 5.0
    saignee: null            # à MESURER — la lame écarte plutôt qu'elle n'enlève
    rayon_interieur_min: 2.5 # = 0,5 x epaisseur (CLAUDE.md)
    voile_min: null          # à MESURER — le carton se déchire, valeur à établir
    fixation: "vis traversante + rondelles larges des deux côtés"
    source_saignee: null
    note: >
      Le plus contraignant des trois, donc celui qui fixe le dessin.
      C'est aussi le seul qui permette d'itérer dans la journée.

  cutter_carton_ondule:
    machine: "cutter à main"
    lieu: "sur place"
    materiau: carton_ondule
    epaisseur: null          # à MESURER — varie selon simple ou double cannelure
    saignee: null            # à MESURER
    rayon_interieur_min: null # = 0,5 x epaisseur, donc inconnu tant qu'elle l'est
    voile_min: null          # à MESURER — un voile étroit s'effondre entre deux cannelures
    fixation: "vis traversante + rondelles larges des deux côtés"
    source_saignee: null
    note: >
      Carton de colis récupéré. DISTINCT du carton-plume : celui-ci est
      une mousse prise entre deux papiers, isotrope dans son plan ; le
      carton ondulé est une cannelure ORIENTÉE, donc anisotrope. Les deux
      ne se coupent pas pareil et ne plient pas pareil.
      Le rayon intérieur minimal reste null tant que l'épaisseur l'est :
      il en dérive.

  laser_contreplaque:
    machine: "laser de fablab"
    lieu: "fablab"
    materiau: contreplaque
    epaisseur: 3.0
    saignee: null            # à MESURER — ordre de grandeur attendu 0,1 à 0,3
    rayon_interieur_min: 1.5
    voile_min: null
    fixation: "vis traversante + écrou"
    source_saignee: null

  decoupe_metal:
    machine: null            # jet d'eau ? laser ? plasma ? À ÉTABLIR
    lieu: "chez le cousin"
    materiau: aluminium
    epaisseur: 3.0
    saignee: null            # à MESURER — varie de 0,2 à 1,5 selon le moyen
    rayon_interieur_min: null # dépend du moyen, donc inconnu tant qu'il l'est
    voile_min: null
    fixation: "vis traversante + écrou, taraudage possible"
    source_saignee: null
    note: >
      Le moyen exact n'est pas connu. Tant qu'il ne l'est pas, aucune
      pièce destinée à ce procédé ne peut être finalisée.

# ═════════════════════════════════════════════════════════════════════════
#  MATÉRIAUX — liés au PROCÉDÉ, plus au palier de taille
#  L'ancienne association materiau/palier supposait que le gros des pièces
#  serait imprimé et que ceux-ci ne serviraient qu'aux renforts.
# ═════════════════════════════════════════════════════════════════════════
materiaux:
  carton_plume:
    anisotrope: false            # mousse : isotrope dans le plan
    epaisseur_nominale: 5.0
    epaisseur_mesuree: null      # protocole du journal 2026-09-28
    masse_surfacique: null       # mg/mm2 — LA grandeur à mesurer
    densite: null
    source: null
  carton_ondule:
    epaisseur_nominale: null     # dépend de la cannelure : à mesurer
    epaisseur_mesuree: null
    masse_surfacique: null       # mg/mm2 — LA grandeur à mesurer
    densite: null
    source: null
    # ── ANISOTROPIE ────────────────────────────────────────────────────
    anisotrope: true
    axe_reference: "sens des cannelures"
    note_anisotropie: >
      Une cannelure est une suite d'arches collées entre deux papiers.
      Elle donne au panneau une direction FORTE (le long des arches) et
      une direction FAIBLE (en travers, où les arches s'écrasent et
      plient). Deux pièces découpées du MÊME DXF mais à 90° l'une de
      l'autre ne sont pas la même pièce.
      Conséquence : toute pièce en carton ondulé doit déclarer
      l'orientation de ses cannelures, et le plan de découpe doit la
      porter — sinon la déclaration reste théorique au moment de couper.
    mesure_epaisseur: >
      Les becs d'un pied à coulisse ÉCRASENT les cannelures, et
      l'écrasement est IRRÉVERSIBLE : le point mesuré est perdu. Mesurer
      une pile de 10 feuilles sous pression légère et diviser, en
      changeant d'endroit à chaque relevé.

  contreplaque:
    epaisseur_nominale: 3.0
    epaisseur_mesuree: null
    masse_surfacique: null
    densite: null
    source: null
  aluminium:
    epaisseur_nominale: 3.0
    epaisseur_mesuree: null
    masse_surfacique: null
    densite: null
    source: null

# ═════════════════════════════════════════════════════════════════════════
#  QUINCAILLERIE — inchangée, nature `interface` (règle 2)
# ═════════════════════════════════════════════════════════════════════════
vis:
  M2:  { diametre: 2.0, passage: 2.4, tete_diametre: 3.8 }
  M3:  { diametre: 3.0, passage: 3.4, tete_diametre: 5.5 }
  M4:  { diametre: 4.0, passage: 4.5, tete_diametre: 7.0 }

roulements:
  MR85:  { interieur: 5,  exterieur: 8,  largeur: 2.5 }
  "623": { interieur: 3,  exterieur: 10, largeur: 4 }
  "688": { interieur: 8,  exterieur: 16, largeur: 5 }

