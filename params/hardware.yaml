      bord_plie_min_mm: {valeur: 18.0, sources: "Grok, tables air-bend ~6 t (Huaxiao, 3 mm → 18 mm) ; Claude 17 mm (4 t + R) ; plus prudente des trois (0064)"}
      trou_pli_mm: {valeur: 14.0, sources: "Claude 14 mm (3 t + R, bord du trou à la ligne de pli) ; Grok 2,5 t + R ; plus prudente des trois (0064)"}
      degagement_pli_mm: {largeur: 4.0, profondeur: 8.5, sources: "Claude 4 × 8,5 mm (247TailorSteel + R 2 de l'opérateur) ; ChatGPT ≥ 8,5 ; plus prudente des trois (0064)"}
