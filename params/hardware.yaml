#    cutter_carton_ondule: { ... }
#    laser_contreplaque:   { ... }
#    decoupe_metal:        { ... }
#        MOTIF : la clé fondait machine et matière. Un laser coupe
#        plusieurs matières, et rien ne reliait deux de ses entrées.
#        Le grain était aussi trop grossier : alu 2 mm et alu 6 mm
#        partageaient une seule ligne.
#        CORRESPONDANCE avec la nouvelle structure :
#          cutter_carton        -> reglages.cutter_cartonplume_5
#          cutter_carton_ondule -> reglages.cutter_cartonondule_double
#          laser_contreplaque   -> reglages.laser_contreplaque_3
#          decoupe_metal        -> reglages.operateur_cn_alu_3
#
#  materiaux.*.epaisseur_nominale
#        MOTIF : une épaisseur n'est pas une propriété du MATÉRIAU mais de
#        la MATIÈRE achetée. Déplacée sous `matieres.*.epaisseur`.
#
#  ── Au 2026-09-28, il n'y a pas d'imprimante 3D (fiche 0014) ──
#  Redevient valable le jour où une imprimante est acquise ET vérifiée.
#  Aucune imprimante vérifiée au 2026-10-01 (fiche 0059). L'outillage relève
#  de la seule décision de Jeremy (fiche 0066, b). Corrigé à la refonte R5 :
#  ce commentaire disait « Jeremy en achète une cette semaine (fiche 0027) ».
#
#  vis:
#    M2:  { insert_diametre: 3.2, insert_profondeur: 4.0 }
#    M3:  { insert_diametre: 4.6, insert_profondeur: 5.7 }
#    M4:  { insert_diametre: 5.6, insert_profondeur: 8.1 }
#        MOTIF : cotes de logement d'insert à chaud, qui se pose dans du
#        thermoplastique imprimé. Ni le contreplaqué, ni le carton, ni
#        l'aluminium n'en acceptent.
#        RÉSERVE : ces valeurs n'ont jamais eu de référence constructeur
#        (audit du 2026-09-28). À resourcer avant tout usage.
#
#  tolerances:
#    impression_3d: { jeu_glissant: 0.20, jeu_serre: 0.05,
#                     logement_roulement: 0.00 }
#        MOTIF : jeux propres au retrait d'une pièce imprimée au
#        refroidissement. Sans objet pour une pièce découpée.
#
#  epaisseurs:
#    paroi_minimale_impression: 1.6
#        MOTIF : fonction du diamètre de buse. Sans objet : pas de buse.
#
#  tolerances:
