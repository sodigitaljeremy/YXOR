  #  actionneurs.yaml — catalogue des candidats (2026-09-30)
  # ═══════════════════════════════════════════════════════════════════════
  #  Les VALEURS sont `catalogue` (fiche constructeur ou revendeur) et de
  #  nature `interface` : un actionneur est une pièce achetée, il ne suit
  #  jamais H (règle 2). Les champs de méthode — source, date, note —
  #  ne sont pas des cotes.
  actionneurs.yaml:
    regles:
      - motif: "consultation"
        origine: propre
        nature: sans_objet
        source: "date de consultation des sources"
      - motif: "dimensionnement.marge"
        origine: propre
        nature: tenue
        source: "décidé par Jeremy le 2026-09-30 (fiche 0051) — pas une norme"
      - motif: "dimensionnement.tolerance_coherence_m"
        origine: propre
        nature: sans_objet
        source: "tolérance numérique du contrôle de cohérence"
      - motif: "dimensionnement.articulations_lourdes"
        origine: propre
        nature: sans_objet
        source: "consigne de Jeremy, 2026-09-30 : configuration mixte"

      # --- référence ToddlerBot : ses nombres viennent de l'amont ---
      - motif: "reference_toddlerbot.hauteur_m.valeur"
        origine: amont
        nature: echelle
        source: "taille publiée de ToddlerBot (fiche 0001)"
      - motif: "reference_toddlerbot.masse_totale_kg.valeur"
        origine: amont
        nature: tenue
        source: "somme des body_mass du MJCF amont épinglé"
      - motif: "reference_toddlerbot.masse_dynamixel_g.*.valeur"
        origine: catalogue
        nature: interface
        source: "e-Manual ROBOTIS, masse par axe"
      - motif: "controle_coherence.toddlerbot.hauteur_m.valeur"
        origine: amont
        nature: echelle
        source: "taille publiée de ToddlerBot (fiche 0001)"
      - motif: "controle_coherence.zeroth01.hauteur_m.valeur"
        origine: ambigu
        nature: echelle
        source: "consigne de Jeremy ; introuvable dans les sources consultées"
        note: "0,48 m déclaré, ~0,40 m lu dans deux sources — voir la note du fichier"
      - motif: "controle_coherence.zeroth01.hauteur_m.autres_valeurs.valeur"
        origine: litterature
        nature: echelle
        source: "README public d'un constructeur indépendant de Zeroth-01"
      - motif: "controle_coherence.*.classe"
        origine: propre
        nature: sans_objet
        source: "rattachement du robot de référence à une classe du catalogue"

      # --- configurations nommées : des choix de calcul, pas des cotes ---
      - motif: "configurations_nommees.**"
        origine: propre
        nature: sans_objet
        source: "configurations demandées par Jeremy le 2026-09-30"

      # --- candidats ---
      - motif: "candidats.*.fiche.*"
        origine: catalogue
        nature: sans_objet
        source: "version et empreinte du document constructeur lu"
      - motif: "candidats.*.*.autres_valeurs.valeur"
        origine: catalogue
        nature: interface
        source: "valeur constructeur non retenue, portée pour mémoire"
      - motif: "candidats.*.*.valeur"
        origine: catalogue
        nature: interface
        source: "fiche constructeur ou revendeur, URL dans le champ `source`"
      - motif: "candidats.*.nom"
        origine: catalogue
