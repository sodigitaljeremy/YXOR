# Provenance des valeurs d'origine ToddlerBot (amont) — lu par scripts/provenance_amont.py
#
# RÉDUIT le 2026-10-01 (refonte R4, décision 4 de Jeremy : « oui à tout »).
# Ce fichier qualifiait TOUTES les valeurs de params/ (origine et nature) pour
# l'audit complet, archivé avec lui : archive/params/origines.yaml et
# archive/scripts/audit_origines.py. N'y restent que les règles qui
# concernent l'AMONT, et, pour joints.yaml, les règles `propre` qui en
# EXCEPTENT des valeurs (la première règle qui correspond l'emporte).
#
# Pourquoi l'amont seul : la mécanique de ToddlerBot est sous CC BY-NC-SA 4.0
# (fiche 0061) ; la portée de la licence sur des valeurs numériques n'est
# pas tranchée (fiche 0010 § 4). L'inventaire reste tenu.
#
# `motif` : chemin de clé, `*` = un segment, `**` = zéro ou plusieurs.

fichiers:
  anthropometry.yaml:
    regles:
    - motif: H
      origine: amont
      source: 'Taille hors-tout publiée de ToddlerBot (fiche 0001 : « ToddlerBot (Stanford). 0,56 m »).
        Depuis le 2026-09-30 : référence du dimensionnement inversé, plus un palier (fiche 0055).

        '
      note: 'RACINE DE TOUTE LA CHAÎNE `propre`. Chaque cote dérivée de H en P1 est une fraction d''un
        nombre venu de ToddlerBot. La portée juridique de ce fait n''est PAS tranchée (fiche 0010 §4).

        '
  joints.yaml:
    regles:
    - motif: '**.fonction'
      origine: propre
      source: description rédigée pour YXOR
      note: prose, pas une cote — sans portée dimensionnelle
    - motif: convention.**
      origine: propre
      source: conventions de repère et d'unités propres au projet
    - motif: symetrie.**
      origine: amont
      source: 'Propriété de symétrie constatée sur le modèle amont et vérifiée par scripts/import_upstream_limits.py.

        '
    - motif: '**.articulation.**'
      origine: amont
      source: params/upstream_joints.generated.yaml, section articulations
      note: axes, sens ET BUTÉES — entièrement extraits du modèle amont
    - motif: '**.actionnement.**'
      origine: amont
      source: params/upstream_joints.generated.yaml, section actionneurs
    - motif: '**.recoupement.**'
      origine: amont
      source: rapports de transmission lus dans le MJCF amont
    - motif: '**.modele.**'
      origine: amont
      source: MJCF amont au commit épinglé
    - motif: '**.materiel.**'
      origine: amont
      source: documentation matérielle amont, ou déduction du modèle amont
    - motif: '**.nom'
      origine: amont
      source: 'Nomenclature adoptée de ToddlerBot par la fiche 0005 (topologie P1). Ce ne sont pas des
        cotes, mais l''origine est amont.

        '
    - motif: particularites.**
      origine: amont
      source: constats établis sur le modèle et la documentation amont
  upstream_joints.generated.yaml:
    regles:
    - motif: '**'
      fourre_tout: true
      origine: amont
      source: 'Fichier généré par extraction du MJCF amont au commit e337f3b177b4b53abff70b31d1695a7b66cc6d2e.
        Amont par construction, intégralement, sans exception.

        '
  ckpts.manifest.yaml:
    regles:
    - motif: '**'
      fourre_tout: true
      origine: amont
      source: empreintes et identifiants des poids ToddlerBot (fiche 0003)
      note: 'Ce ne sont pas des cotes mécaniques : aucune portée dimensionnelle. Listé pour l''exhaustivité
        de l''inventaire.

        '
  actionneurs.yaml:
    regles:
    - motif: reference_toddlerbot.hauteur_m.valeur
      origine: amont
      source: taille publiée de ToddlerBot (fiche 0001)
    - motif: reference_toddlerbot.masse_totale_kg.valeur
      origine: amont
      source: somme des body_mass du MJCF amont épinglé
    - motif: controle_coherence.toddlerbot.hauteur_m.valeur
      origine: amont
      source: taille publiée de ToddlerBot (fiche 0001)
