# Registre des sources documentaires — voir decisions/archive/0040.
#
# ─────────────────────────────────────────────────────────────────────────
#  UN REGISTRE, PAS UN INDEX DE RECHERCHE
# ─────────────────────────────────────────────────────────────────────────
#  Neuf documents ne sont pas un problème de recherche. Ce fichier ne sert
#  pas à RETROUVER un passage : il sert à savoir CE QU'ON A LU, jusqu'où,
#  et ce qu'on a le droit d'en citer.
#
#  Le chapitre 5 de `forget2018` a été lu en entier. C'est cette lecture
#  continue qui a permis de corriger une distinction — trois régions de
#  fonctionnement, pas quatre — qu'un découpage en fragments aurait
#  détruite. Un extrait sémantique ne cite pas une page ; il ne dit pas
#  non plus ce qu'il a omis.
#
# ─────────────────────────────────────────────────────────────────────────
#  CE FICHIER NE CONTIENT AUCUN CHEMIN
# ─────────────────────────────────────────────────────────────────────────
#  Les chemins vers les exemplaires sont dans `sources.local.yaml`, IGNORÉ
#  par Git : ils sont propres à une machine et n'ont pas à voyager.
#
#  Et une RÈGLE, qui est la raison d'être de cette séparation :
#
#      Les exemplaires vivent dans un dossier qui contient aussi des
#      documents personnels sans rapport avec le projet. On n'explore
#      JAMAIS ce dossier. On ouvre les neuf chemins nommés dans
#      `sources.local.yaml`, et rien d'autre.
#
#  Le registre existe pour rendre toute exploration inutile.
#
# ─────────────────────────────────────────────────────────────────────────
#  L'EMPREINTE N'EST PAS DÉCORATIVE
# ─────────────────────────────────────────────────────────────────────────
#  Une citation « p. 97 » ne vaut que pour l'exemplaire lu. Deux tirages
#  d'un même ouvrage n'ont pas la même pagination ; un PDF recompressé non
#  plus. `scripts/source.py` vérifie l'empreinte AVANT toute lecture et
#  refuse si elle a changé.
#
#  `lecture` : lu | partiel | non_lu — et `lu` dit QUELLES pages.
#  Un `non_lu` est une information, pas un oubli : il dit qu'aucune
#  affirmation du dépôt ne peut s'en réclamer.

