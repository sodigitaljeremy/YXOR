# ═════════════════════════════════════════════════════════════════════════
#  Phases — ce que chacune achète
# ═════════════════════════════════════════════════════════════════════════
#  Postes `actionneur:*` : résolus par la configuration étudiée, sauf
#  `actionneur:<id>` qui désigne une classe précise du catalogue.
#    actionneur:lourde  la classe de l'articulation la plus exigeante
#    actionneur:legere  la classe la moins exigeante de la configuration
#    actionneur:jambes  les 12 actionneurs de jambe, chacun de SA classe
#  Poste `adaptateur_bus` : TTL si toutes les classes sont Feetech, CAN sinon.
phases:
  # MODIFIÉ le 2026-10-01 (refonte R6, fiche 0065 : le banc VÉRIFIE le RS00).
  # Ancien texte : phase « 2 × RS05 », configuration rs05_x2, et une option
  # « verification » (2 × Damiao J4310, configuration verification_j4310_x2) ;
  # historique git et étiquette avant-refonte-2026-10-01.
  banc:
    statut: "composition NON DÉCIDÉE (Jeremy) ; achat selon la fiche 0066"
    description: >
      2 × RS00 identiques et 1 adaptateur USB-CAN : vérifier le RS00
      retenu pour S (fiche 0065), mesurer la dispersion entre deux
      exemplaires, garder une rechange (docs/protocole-banc.md).
    # Actionneurs LUS dans params/banc.yaml (source unique).
    configuration: rs00_x2
    postes:
      - {poste: adaptateur_can, quantite: 1}
    non_chiffre: "outillage du banc (alimentation, arrêt d'urgence, mesure d'effort…) : décision de Jeremy (fiche 0066, b) ; cahier des charges au protocole § 7"
  jambes_v1:
    description: "12 DDL de jambe, électronique embarquée, structure"
    postes:
      - {poste: "actionneur:jambes", quantite: 12}
      - {poste: adaptateur_bus, quantite: 1}
      - {poste: ordinateur, quantite: 1}
      - {poste: imu, quantite: 1}
      - {poste: batterie, quantite: 1}
      - {poste: structure, quantite: 1}
  haut_du_corps_v2:
    description: "18 DDL de ToddlerBot hors jambes (14 bras, 2 taille, 2 cou), classe légère"
    postes:
      - {poste: "actionneur:legere", quantite: 18}
      - {poste: structure, quantite: 1}
