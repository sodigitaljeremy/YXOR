    article: "Gens ace LiPo 6S 22,2 V 5000 mAh 45C"
    prix: {valeur: 155.00, devise: CHF, vendeur: "hobbyshop.ch", source: "https://www.hobbyshop.ch/gens-ace-5000-mah-6s-22-2v-45c-lipo-pack-b-45c-5000-6s1p-gen116.html", consulte_le: "2026-09-30"}
