# Budget par phase — lu par scripts/dimensionnement.py
#
# Un CHIFFRAGE demandé par Jeremy, pas une liste d'achat (CLAUDE.md,
# règle d'achat c). Chaque prix porte sa source et sa date ; un prix
# inconnu est null, et le total qui en dépend s'affiche « ≥ », jamais
# comme s'il était complet.
#
# coût TTC = (actionneurs + électronique + structure) × (1 + imprévus) × (1 + TVA)
#
# Non comptés, et dit : frais de port, droits de douane, visserie,
# câblage, connecteurs, outillage. Ils ne sont pas nuls ; ils sont
# INCONNUS.

consultation: "2026-09-30"

tva_ch:
  valeur: 0.081
  source: "prompt relayé par Jeremy, auteur non établi (« consigne de Jeremy » jusqu'au 2026-09-30, 23 h 50) ; taux normal depuis le 2024-01-01 selon l'extrait de recherche de https://www.estv.admin.ch/fr/taux-de-la-tva-suisse"
  consulte_le: "2026-09-30"
  note: "La page de l'AFC n'a PAS pu être ouverte (connexion réinitialisée) : confirmation officielle à faire."

# Livraison possible dans les DEUX pays (Jeremy, 2026-09-30, ~23 h, lot de
# cohérence point 9). La TVA de chaque pays est dans `tva_<pays>`. Le
# classement des FAMILLES reste calculé hors taxe ; le comparatif du banc
# affiche le coût TTC dans chaque pays, et note sur le PREMIER de la liste.
# Port, droits de douane et frais de dédouanement : inconnus (null), non
# comptés — voir le journal du 2026-09-30, « Sensibilité à la livraison ».
livraison: [CH, FR]

tva_fr:
  valeur: 0.20
  source: "taux normal français ; cadrage § 5 (non revérifié ici sur une page officielle)"
  consulte_le: "2026-09-30"

marge_imprevus:
  valeur: 0.15
  source: "choix provisoire de l'assistant, 2026-09-30"
  note: "PARAMÈTRE À FIXER PAR JEREMY. Laissé visible dans chaque total."

# Taux de référence BCE, tous exprimés POUR 1 EUR. Le taux croisé vers le
# CHF se calcule dans le script, il ne se déclare pas.
taux_de_change:
  source: "https://www.ecb.europa.eu/stats/policy_and_exchange_rates/euro_reference_exchange_rates/html/index.en.html"
  date_reference: "2026-09-30"
  par_eur:
    CHF: {valeur: 0.9478}
    USD: {valeur: 1.1355}
    CNY: {valeur: 7.6130}

