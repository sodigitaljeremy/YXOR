  imu:
    article: "Adafruit BNO085 (réf. 4754)"
    prix: {valeur: 24.95, devise: CHF, vendeur: "BerryBase CH", source: "https://www.berrybase.ch/en/adafruit-9-dof-orientation-imu-fusion-breakout-bno085-bno080", consulte_le: "2026-09-30"}
