    prix: {valeur: null, devise: null, vendeur: null, source: null, consulte_le: "2026-09-30"}
    non_verifie: "37,80–42,00 USD (eBay) et 35 USD (CANable, openlightlabs.com) lus dans des extraits ; pages en 429"
  ordinateur:
    article: "Raspberry Pi 5, 8 Go"
    prix: {valeur: 159.55, devise: CHF, vendeur: "BerryBase CH", source: "https://www.berrybase.ch/en/raspberry-pi-5-8gb-ram", consulte_le: "2026-09-30"}
