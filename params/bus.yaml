  scs15_c022:
    min_V: 4
    max_V: 8.4
    source: marche_bus_c_aifitlab_scs15_c022
    page: 3
    note: « 工作电压 Input Voltage 4V-8.4V » ; typique 6 / 7,4 V.
  scs2332_c001:
    min_V: 4
    max_V: 8.4
    source: marche_bus_c_aifitlab_scs2332
    page: 3
    note: « 5-7 工作电压 Input Voltage 4V-8.4V » (mode mise en page) ; typique 4,8 / 6 V. Document intitulé « SCS2332
      », sans suffixe -C001.
  hl2909_c001:
    min_V: null
    max_V: null
    source: null
    page: null
    note: 'fiche constructeur non téléchargée : DNS feetechrc.com ; aucune copie de fiche ni page revendeur trouvée.'
  hl2915_c001:
    min_V: 9
    max_V: 14
    source: marche_bus_c_aifitlab_hl2915_c001
