# Marché des cartes de bus, trame CAN, protocole RobStride, tensions Feetech — lu par scripts/marche_composants.py
#
# DONNÉES SEULEMENT (2026-10-07) : aucune intégration à l'explorateur, aucun achat (fiche 0066).
# Contexte DÉCIDÉ (fiche 0070, Jeremy, 2026-10-07) : « Les deux robots, YXOR Lab et YXOR, fonctionnent
# entièrement sur batterie. Je préfère NVIDIA Jetson, mais je veux une comparaison chiffrée avec le
# Raspberry Pi 5 et ses cartes d'IA. »
#
# Même méthode que le marché des actionneurs : une valeur non lue est null ; deux sources qui divergent,
# la plus prudente (fiche 0064), l'autre en note. Relevé par quatre agents de Claude Code le 2026-10-07 ;
# chaque source est TÉLÉCHARGÉE (hors du dépôt) et inscrite au registre params/fournisseurs.yaml sous
# la clé citée ici (marche_<domaine>_<id>), redistribuable: false. Les valeurs dérivées (énergie non
# publiée, volume, densités, CHF HT, TOPS/W, canaux CAN) sont CALCULÉES par scripts/marche_composants.py,
# jamais déclarées ici.

trame_can:
  sof_bits:
    valeur: 1
    source: marche_bus_bosch_can20_1991
    page: 45
    note: « a single 'dominant' bit » (Partie B, p. 43 imprimée)
  identifiant_standard_bits:
    valeur: 11
    source: marche_bus_bosch_can20_1991
    page: 45-46
    note: ID-28…ID-18
  identifiant_etendu_bits:
    valeur: 29 = 11 (Base ID) + 18 (Extended ID)
    source: marche_bus_bosch_can20_1991
    page: 46-47
    note: null
  rtr_bits:
    valeur: 1
    source: marche_bus_bosch_can20_1991
    page: 45
    note: dominant pour une trame de données
  srr_bits_etendue:
    valeur: 1
    source: marche_bus_bosch_can20_1991
    page: 47
    note: récessif, à la place du RTR de la trame standard
  ide_bits:
    valeur: 1
    source: marche_bus_bosch_can20_1991
    page: 47
    note: dans le champ d'arbitrage en trame étendue ; dans le champ de contrôle en trame standard
  champ_controle_bits:
    valeur: 6
    source: marche_bus_bosch_can20_1991
    page: 47
    note: 'standard : IDE + r0 + DLC (4) ; étendue : r1 + r0 + DLC (4)'
  dlc_bits:
    valeur: 4
    source: marche_bus_bosch_can20_1991
    page: 47-48
    note: null
  donnees_bits_8_octets:
    valeur: 64
    source: marche_bus_bosch_can20_1991
    page: 49
    note: 0 à 8 octets de 8 bits, MSB en premier
  crc_sequence_bits:
    valeur: 15
    source: marche_bus_bosch_can20_1991
    page: 49
    note: 'registre CRC_RG(14:0) de 15 bits, polynôme X15+X14+X10+X8+X7+X4+X3+1 ; TI SLOA101B p. 3 : « 16-bit (15
      bits plus delimiter) »'
  crc_delimiteur_bits:
    valeur: 1
    source: marche_bus_bosch_can20_1991
    page: 50
    note: null
  ack_bits:
    valeur: 2
    source: marche_bus_bosch_can20_1991
    page: 50
    note: ACK SLOT + ACK DELIMITER
  eof_bits:
    valeur: 7
    source: marche_bus_bosch_can20_1991
    page: 51
    note: sept bits récessifs
  intertrame_intermission_bits:
    valeur: 3
    source: marche_bus_bosch_can20_1991
    page: 55
    note: 'l''INTERFRAME SPACE comprend INTERMISSION (3 bits récessifs) puis BUS IDLE (durée quelconque) et, pour
      une station « error passive » qui vient d''émettre, SUSPEND TRANSMISSION (8 bits). DIVERGENCE : TI SLOA101B
      p. 3 écrit « This 7-bit interframe space (IFS) » ; pour un calcul de charge, la valeur la plus prudente est
      donc 7 (TI), la spécification dit 3'
  intertrame_ti_bits:
    valeur: 7
    source: marche_bus_ti_sloa101b
    page: 3
    note: valeur divergente de la spécification Bosch (3 bits d'INTERMISSION) ; à retenir si l'on applique « la
      plus prudente »
  total_standard_8_octets_sans_bourrage_bits:
    valeur: 108
    source: marche_bus_bosch_can20_1991
    page: 45-51
    note: 'CALCULÉ par somme des champs lus : 1+11+1 (RTR) +6 (IDE, r0, DLC) +64+15+1+2+7 ; + intertrame 3 → 111
      (ou 115 avec l''IFS de TI)'
  total_etendue_8_octets_sans_bourrage_bits:
    valeur: 128
    source: marche_bus_bosch_can20_1991
    page: 45-51
    note: 'CALCULÉ : 1+11+1 (SRR) +1 (IDE) +18+1 (RTR) +6 (r1, r0, DLC) +64+15+1+2+7 ; + intertrame 3 → 131 (ou
      135 avec l''IFS de TI)'
  regle_bourrage:
    valeur: après 5 bits consécutifs de même valeur, l'émetteur insère un bit complémentaire
    source: marche_bus_bosch_can20_1991
    page: 60
    note: « STUFF ERROR » détectée au 6e bit égal consécutif (p. 60) ; même règle dans TI SLOA101B p. 3
  portee_bourrage:
    valeur: du START OF FRAME à la fin de la CRC SEQUENCE (SOF, arbitrage, contrôle, données, séquence CRC)
    source: marche_bus_bosch_can20_1991
    page: 60
    note: 'non bourrés : délimiteur CRC, champ ACK, END OF FRAME (forme fixe), trames d''erreur et de surcharge.
      Le nombre maximal de bits de bourrage n''est pas publié dans la spécification lue : à calculer, pas à déclarer'
protocole_robstride:
  interface:
    valeur: CAN 2.0
    source: marche_bus_rs00_manuel_260713
    page: 38
    note: même phrase RS02 p. 41, RS05 p. 45 (« The motor communication is the CAN 2.0 communication interface »)
  debit_can_defaut:
    valeur: 1 Mbit/s
    source: marche_bus_rs00_manuel_260713
    page: 11
    note: tableau driver « CAN bus bit rate 1Mbps » ; RS02 p. 12, RS05 p. 14 ; répété au protocole (RS00 p. 38)
      et au protocole MIT (RS00 p. 70)
  debits_possibles:
    valeur: 1 M, 500 k, 250 k, 125 kbit/s
    source: marche_bus_rs00_manuel_260713
    page: 43-44
    note: 'type de communication 23 (0x17), octet F_CMD : 01 = 1M, 02 = 500K, 03 = 250K, 04 = 125K ; effet après
      remise sous tension. RS02 p. 46, RS05 p. 51. Paramètre 0x2009 motor_baud (RS00 p. 21)'
  format_trame_protocole_prive:
    valeur: trame étendue, identifiant 29 bits
    source: marche_bus_rs00_manuel_260713
    page: 38
    note: 'identifiant : bits 28-24 type de communication, bits 23-8 zone de données 2, bits 7-0 adresse de destination
      ; RS02 p. 41, RS05 p. 45'
  format_trame_protocole_mit:
    valeur: trame standard, identifiant 11 bits
    source: marche_bus_rs00_manuel_260713
    page: 70
    note: protocole MIT, débit par défaut 1 Mbit/s, « baud rate can be modified by switching to the private protocol
      » ; RS02 p. 72, RS05 p. 79. Un 3e protocole, CANopen (DS402), existe (chapitre 5, RS00 p. 61 et suivantes)
      ; bascule par type 25, effective après redémarrage (p. 44, 49)
  octets_donnees_commande:
    valeur: 8
    source: marche_bus_rs00_manuel_260713
    page: 38-39
    note: '« 29-bit ID 8Byte data field » pour chaque type ; commande de type 1 (contrôle « opération ») : couple
      dans l''identifiant (bits 23-8), angle, vitesse, Kp, Kd sur les 8 octets'
  octets_donnees_reponse:
    valeur: 8
    source: marche_bus_rs00_manuel_260713
    page: 39-40
    note: 'trame de retour type 2 : 8 octets ; défauts et mode codés dans l''identifiant 29 bits'
  une_reponse_par_commande:
    valeur: true
    source: marche_bus_rs00_manuel_260713
    page: 39
    note: 'après la commande de type 1 : « Response frame: Response motor feedback frame (see communication type
      2) » ; même mention pour les autres types de commande. Il s''agit d''une lecture du texte, pas d''une mesure
      du bus'
  remontee_active:
    valeur: désactivée par défaut ; type 24 ; intervalle par défaut 10 ms
    source: marche_bus_rs00_manuel_260713
    page: 44
    note: 'p. 48 : « Report type: Type 2 (default interval: 10ms) », réglable par EPScan_time (p. 47 : « 1 indicates
      10ms. Plus 1 increments by 5ms ») ; l''outil PC indique « a minimum of 10ms » (p. 16). RS02 p. 17 et 47, RS05
      p. 18 et 51'
  can_fd_firmware:
    valeur: null
    source: marche_bus_rs00_manuel_260713
    page: null
    note: 'aucune mention de CAN-FD (ni « CAN FD », « CANFD », « flexible data ») dans les trois manuels 260713
      ni dans l''arborescence du dépôt ; tous disent « CAN 2.0 ». Absence de mention, pas preuve d''absence : prise
      en charge non établie'
  debit_donnees_fd:
    valeur: null
    source: null
    page: null
    note: sans objet tant que le CAN-FD n'est pas documenté
  frequence_commande_max:
    valeur: null
    source: null
    page: null
    note: 'non documentée dans les trois manuels ; seules valeurs temporelles publiées : remontée active 10 ms par
      défaut (p. 44), minimum 10 ms dans l''outil PC (p. 16)'
  temporisation_perte_can:
    valeur: CAN_TIMEOUT, 20000 = 1 s ; 0 = désactivé ; au-delà, passage en mode reset
    source: marche_bus_rs00_manuel_260713
    page: 28
    note: RS02 p. 31, RS05 p. 34 ; aussi p. 47 (« timeout threshold, 20000 is 1s »)
  adaptateur_canhub_debit:
    valeur: 1M configuré dans la procédure
    source: marche_bus_rs_canhub_v1_0
    page: 12
    note: manuel chinois de l'adaptateur USB-CANHUB RobStride (5 voies CAN, p. 11-12)
tensions_feetech:
