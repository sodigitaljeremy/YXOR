    min_V: 6
    max_V: 12
    source: marche_bus_c_aifitlab_sts3250
    page: 3
    note: « 额定工作电压 Rated Input Voltage 6V-12V » ; typique 12 V. Concorde avec la note « plage 6–12 V » déjà au dépôt.
  st3215_c018:
    min_V: 4
    max_V: 14
    source: marche_bus_c_akizuki_st3215_c018
    page: 3
    note: « 5-7 工作电压范围 Rated Input Voltage 4V-14V » ; nominale 12 V (5-1).
  st3215_c001:
    min_V: 4
    max_V: 7.4
    source: marche_bus_c_aifitlab_sts3215
    page: 3
