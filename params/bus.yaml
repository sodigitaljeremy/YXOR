      « STS3032 » (simple axe), sans suffixe : rattachement à C001 non garanti.'
  st3032_c036:
    min_V: 4
    max_V: 7.4
    source: marche_bus_c_aifitlab_sts3032_c036
    page: 3
    note: « 额定工作电压 Rated Input Voltage 4V-7.4V » ; typique 4,8 / 6 V.
  st3036_c001:
