familles:
- famille: Hiwonder
  fabricant: Hiwonder (anciennement vendu sous LewanSoul pour la LX-16A)
  fiabilite:
  - resume: 'LX-16A (Sawppy, plusieurs années d’usage) : engrenages métal et roulement jugés bons ; mais deux utilisateurs
      ont vu la tension batterie (~7,4 V) renvoyée sur le 5 V USB (Raspberry Pi détruit), et un servo défaillant
      a court-circuité la batterie à la masse. Approvisionnement jugé peu fiable. L’auteur abandonne la LX-16A.'
    source: marche_servo_fia_hw_lx16a_newscrewdriver
  - resume: 'Avis client LX-15D (hiwonder.com) : sensible aux tensions trop hautes, sans protection ; pas de RS-485.'
    source: marche_servo_hw_lx15d
  robots:
  - nom: Walbi, the Walking Biped
    lien: https://www.hackster.io/the-inner-geek/walbi-the-walking-biped-8feacd
    servos: LX-16A (LewanSoul)
    licence: GPL3+ (copyleft fort)
    marche: marche par capture et relecture de mouvements, pas par contrôleur
    source: marche_servo_rob_hw_walbi
  note: Le lien LX-16A ↔ Hiwonder vient de servodatabase (marche_servo_sdb_hiwonder_lx16a).
- famille: Waveshare
  fabricant: Waveshare
  fiabilite:
