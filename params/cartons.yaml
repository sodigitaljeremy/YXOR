# Marché des CARTONS découpables au cutter, pour YXOR Kit — VERSÉ le 2026-10-08
#
# Étude d'un agent (prompt « Étude de YXOR Kit », point 2). Chaque valeur vient d'une source
# TÉLÉCHARGÉE, inscrite à params/fournisseurs.yaml (marche_carton_*, sha256, non redistribuable) ;
# une valeur non lue est null ; le seul calcul est le prix au m² (prix lu ÷ surface du format lu,
# taux BCE du jour). Aucun achat n'est recommandé (fiche 0066).
#
# ⚠ AUCUN carton ondulé vendu au détail ne publie d'ECT, de flexion ni d'éclatement : ils viennent
#   des QUALITÉS normalisées (`qualites_typiques` : DIN 55468-1 relayée par trois sites qui
#   divergent, la norme elle-même NON LUE ; WK-10 ; LNE C.27, colonnes reconstruites d'un PDF mal
#   extrait, à vérifier). Un rattachement produit → qualité est DÉCLARÉ (IGEPA, Jungheinrich) ou
#   INDICATIF (Modulor). Le classement est dans docs/kit-yxor.md (critères PROPOSÉS).
# Sites refusant le téléchargement : Jumbo, Hornbach, Bauhaus, Galaxus, Raja, Ratioform, Gerstaecker,
# Lyreco, Brack, Officeworld ; leurs prix ne sont pas repris.
