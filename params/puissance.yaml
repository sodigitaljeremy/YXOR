        page: 2
      tension_service:
        valeur: 15-60
        unite: V
        source: marche_pui_rs_decharge_en_v10
        page: 3
        note: pointe 80 V < 100 ms ; isolement 500 V vers les trous de fixation
      seuil_declenchement_48v:
        valeur: 53.5
        unite: V
        source: marche_pui_rs_decharge_zh_v11
        page: 3
        note: '± 0,5 V, arrêt à 50,5 ± 0,5 V. La V1.0 anglaise dit 64 ± 0,5 V / arrêt 59 ± 0,5 V. Valeur prudente
          retenue = la V1.1, plus récente et plus basse. ATTENTION : en 13S (54,6 V pleine charge), un seuil de
          53,5 V ferait décharger la batterie pleine dans la résistance ; en 12S (50,4 V) il reste au-dessus. À
          l''inverse, 64 V (V1.0) dépasse la protection de surtension de 60 V des moteurs. Le manuel V1.1 dit que
          d''autres seuils sont possibles sur demande.'
      seuil_declenchement_24v:
        valeur: 27
        unite: V
        source: marche_pui_rs_decharge_zh_v11
        page: 3
        note: arrêt 25,5 V ; la V1.0 dit 34/31 V
      selection_plateforme:
        valeur: 'interrupteur DIP : 0 = 24 V, 1 = 48 V ; ne pas basculer sous tension'
        unite: null
        source: marche_pui_rs_decharge_en_v10
        page: 2
      courant_continu:
        valeur: 30
        unite: A
        source: marche_pui_rs_decharge_en_v10
        page: 3
      courant_pointe:
        valeur: 200
        unite: A
        source: marche_pui_rs_decharge_en_v10
        page: 3
        note: pendant 100 ms
      resistance_recommandee:
        valeur: 3 Ω/500 W à 10 Ω/200 W
        unite: null
        source: marche_pui_rs_decharge_en_v10
        page: 3
        note: non fournie dans les bornes ; recommandation « membres supérieurs et inférieurs de robots humanoïdes
          »
      usage:
