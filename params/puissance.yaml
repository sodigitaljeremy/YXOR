# Système électrique de YXOR — chaîne de puissance, sécurité, rails, hypothèses
# lu par scripts/systeme_electrique.py (et l'explorateur)
#
# Créé le 2026-10-07 (phase 4a quinquies). TOUT CE FICHIER EST PROPOSÉ par
# Claude : AUCUNE DÉCISION. Le contexte, lui, est décidé :
#   · fiche 0070 (Jeremy, 2026-10-07) : les deux robots fonctionnent
#     entièrement sur batterie ;
#   · fiche 0071 (Jeremy, 2026-10-07, soir) : autonomie 30 min (Lab) et
#     60 min (final) sur le cycle 40 s de marche + 20 s debout ; IA « commande
#     + vision » (Lab) et « modèle de langage local » (final) ; « Je
#     trancherai entre 12S et 13S sur les chiffres. »
#
# Les produits (bloc `marche`) suivent la méthode des marchés : une valeur
# non lue est null ; chaque source est téléchargée hors du dépôt et inscrite
# à params/fournisseurs.yaml (marche_pui_<id>, non redistribuable).

statut: "PROPOSÉ par Claude le 2026-10-07 : architecture et hypothèses à confirmer par Jeremy"

# DÉCIDÉ PAR JEREMY le 2026-10-08 (fiche 0072), ses mots : « Je retiens le 12S
# pour les deux robots, sur les chiffres de l'explorateur du 7 octobre. »
tension_retenue:
  S: 12
  decide: "Jeremy, 2026-10-08, prompt du lot 4a sexies (fiche 0072)"
  coupure_V_par_cellule: 3.0
  coupure_decide: "Jeremy, 2026-10-08 (lot 4a septies), ses mots : « Je retiens une coupure à 3,0 V par cellule. » Réglage du BMS, réversible : ligne de journal et index (règle 5), la fiche 0072 n'est pas réécrite."

# ── Chaîne de puissance, dans l'ordre du courant ──────────────────────────
# Chaque maillon est choisi dans `marche` (le moins cher dont les valeurs LUES
# tiennent le courant et la tension) ; sa masse, son volume et son prix sont
# comptés par l'explorateur.
chaine:
  - {maillon: cellules,    role: "pack Li-ion 12S ou 13S en 21700 (variantes)"}
  - {maillon: fusible,     role: "coupe un court-circuit du pack ; calibre ≥ courant de pointe, tension DC ≥ pleine charge", categorie: fusible}
  - {maillon: sectionneur, role: "coupure manuelle, accessible, pour la maintenance et le transport", categorie: sectionneur}
  - {maillon: bms,         role: "surveille chaque cellule ; coupe en surtension, sous-tension, surintensité, température", categorie: bms}
  - {maillon: contacteur,  role: "ouvert par l'arrêt d'urgence MATÉRIEL, indépendant du calculateur", categorie: contacteur}
  - {maillon: precharge,   role: "charge les condensateurs des variateurs avant la fermeture du contacteur (pas d'étincelle ni de pic)", categorie: precharge}
  - {maillon: bus_moteurs, role: "les actionneurs du corps (RobStride), directement à la tension du pack"}

# Variante « chaîne COMPACTE », PROPOSÉE (lot 4a septies, 2026-10-08) : moins de maillons, chacun plus petit.
# Le BMS à port commun (charge et décharge par les mêmes bornes) accepte la régénération et COUPE lui-même
# (MOSFET) ; le relais d'arrêt, de petit calibre, est ouvert par l'arrêt d'urgence matériel ; l'interrupteur
# anti-étincelle remplace sectionneur et précharge. Une catégorie absente du marché retombe sur la suivante.
chaine_compacte:
  - {maillon: cellules,       role: "pack Li-ion 12S en 21700"}
  - {maillon: fusible,        role: "coupe un court-circuit du pack", categorie: [fusible_compact, fusible]}
  - {maillon: anti_etincelle, role: "mise sous tension sans étincelle, coupure manuelle", categorie: [anti_etincelle, precharge]}
  - {maillon: bms,            role: "BMS à port commun, coupure intégrée, accepte la régénération", categorie: [bms_port_commun, bms]}
  - {maillon: relais_arret,   role: "ouvert par l'arrêt d'urgence matériel", categorie: [contacteur_compact, contacteur]}
  - {maillon: bus_moteurs,    role: "les actionneurs du corps"}

# Règle de choix des maillons (PROPOSÉE, lot 4a septies) : courant RÉEL de la solution (courant de pointe à la
# coupure) × marge ; parmi les produits vérifiables qui conviennent, le plus PETIT en volume, puis le plus léger,
# puis le moins cher. Elle s'applique aux deux chaînes.
choix_maillons:
  marge_courant: 1.5
  ordre: [volume, masse, prix]
  statut: "PROPOSÉ par Claude (2026-10-08) : marge et ordre à confirmer par Jeremy"

# Régénération : au freinage, les moteurs renvoient de l'énergie dans le bus ;
# si le BMS refuse la charge (pack plein), la tension monte vers la protection
# de 60 V des RobStride. Un absorbeur (résistance de freinage ou module de
# décharge RobStride, à documenter) borne cette tension.
absorbeur_regeneration: {role: "borne la tension du bus au freinage", categorie: regeneration}

# Arrêt d'urgence MATÉRIEL : il ouvre le contacteur sans passer par le
# calculateur ni par le bus CAN (une panne logicielle ne l'empêche pas).
arret_urgence: {role: "bouton à contacts NF en série avec la bobine du contacteur", categorie: arret_urgence}

# Rails secondaires, par convertisseurs DC/DC depuis le pack (jamais le
# calculateur sur le bus moteurs directement : prompt du 2026-10-07).
rails:
  "12":  {usage: "calculateur (carte porteuse 12 V), capteurs", categorie: dcdc}
  "7.4": {usage: "servos Feetech de 7,4 V nominal", categorie: dcdc}
  "6":   {usage: "servos Feetech de 6 V", categorie: dcdc}
  "5":   {usage: "Raspberry Pi 5 (5 V 5 A), depuis le rail 12 V", categorie: dcdc}

# ── Hypothèses du calcul d'énergie et de place (toutes PROPOSÉES) ─────────
hypotheses:
  rendement_actionneurs:
    bas: 0.4
    haut: 0.7
    statut: "PROPOSÉ : puissance électrique = puissance mécanique ÷ rendement ; bande large faute de rendement publié (un actionneur à faible réduction rend peu à fort couple et faible vitesse). Une solution doit tenir au rendement BAS."
  energie_au_dessus_de_la_coupure:
    "2.5": 1.0
    "3.0": 0.85
    "3.2": 0.70
    statut: "PROPOSÉ (2026-10-08) : part de l'énergie NOMINALE (publiée jusqu'à 2,5 V par cellule) encore disponible au-dessus de la tension de coupure. Prudent : aucune courbe de décharge n'a été lue NUMÉRIQUEMENT (graphiques des fiches) ; à remplacer par la courbe de la cellule retenue."
  fraction_utilisable:
    valeur: 0.9
    statut: "PROPOSÉ : part de l'énergie nominale des cellules utilisable avant le seuil d'arrêt (BMS, vieillissement)"
  facteur_pack_masse:
    valeur: 1.3
    statut: "PROPOSÉ : masse du pack = masse des cellules × 1,3 (barrettes, fils, boîtier, isolants ; BMS compté à part). Ordre de grandeur « +20 à 35 % » d'un rapport secondaire (rapport_batteries_claude), non vérifié."
  facteur_pack_volume:
    valeur: 1.2
    statut: "PROPOSÉ : volume du pack = volume des cylindres ÷ (π/4, rangement carré, CALCULÉ) × 1,2 (boîtier)"
  remplissage_tronc:
    valeur: 0.5
    statut: "PROPOSÉ : part du volume du tronc (largeur d'épaules × profondeur de poitrine × hauteur du tronc, ANSUR) disponible pour l'électronique ; le reste : structure, moteurs de taille et d'épaules, câbles"
  imu_cablage_kg:
    valeur: 0.3
    statut: "PROPOSÉ (exigences_S.yaml, charge_utile.detail_kg.imu_can_distribution_cablage, 2026-10-01) : la seule part de l'ancienne charge utile de 1,2 kg qui n'est pas un composant chiffré ici"
  debout:
    statut: "Pendant les 20 s debout, la puissance MÉCANIQUE est nulle ; les pertes de maintien (I²R aux couples de posture) ne sont PAS comptées : couples debout non calculés. L'énergie est donc sous-estimée de ces pertes (dit dans le rapport)."
  niveaux_ia:
    statut: "PROPOSÉ : traduction d'un niveau d'IA en matériel ; à confirmer par Jeremy"
    "commande seule": {accelerateur: false, memoire_GB: 4}
    "+ vision": {accelerateur: true, memoire_GB: 4}
    "+ vision et voix": {accelerateur: true, memoire_GB: 8}
    "+ modèle de langage local": {accelerateur: true, memoire_GB: 16, modele_de_langage: true}
    modele_de_langage: "accélérateur présenté par son fabricant pour les modèles de langage : GPU des Jetson (CUDA), Hailo-10H de l'AI HAT+ 2 ; pas les Hailo-8 / 8L (vision)"

