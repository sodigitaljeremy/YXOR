      categorie: regeneration
      nom: RobStride Discharge Module (泄放模块, « bleeder module »)
      fabricant: RobStride (Beijing Robstride Technology)
      principe:
        valeur: 'hacheur de freinage : au-dessus d''un seuil de tension de bus, commute une résistance externe (bornes
          R+/R-) en parallèle sur le bus (B+/B-) ; hystérésis ; LED en décharge, buzzer en surchauffe'
        unite: null
