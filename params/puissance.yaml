        valeur: 30
        unite: A
        source: marche_pui_rs_decharge_en_v10
        page: 3
      courant_pointe:
        valeur: 200
        unite: A
        source: marche_pui_rs_decharge_en_v10
        page: 3
        note: pendant 100 ms
