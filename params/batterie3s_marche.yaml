tension_servos:
- modele: Feetech STS3215 12 V
  reference: ST-3215-C018
  plage_publiee_V:
  - min: 4
    max: 14
    ou: 'OpenELAB : « Input voltage range 4-14 V » ; FAQ : « The datasheet lists 4-14 V input »'
  - min: 4
    max: 14
    ou: 'AIFitLab : tableau « Operating Voltage Range » colonne 12 V : 4-14V'
  - min: 6
    max: 12.6
    ou: 'Waveshare ST3215 (30 kg.cm@12V) : « Input Voltage: 6-12.6V », « it can directly supply power with the 2s
      or 3s lithium battery »'
  - min: 6
    max: 12.6
    ou: 'Waveshare page produit : OPERATING VOLTAGE 6 ~ 12.6 V (variante 30 kg.cm@12V)'
  valeur_max_V: 12.6
  regle_valeur: plus prudente (tension admissible la plus basse) entre 14 et 12,6
  variante_voisine:
    reference: ST3215-C047
    plage_V: 4- 14V
    note: fiche Comet, variante bras « leader » SO-ARM101, pas la C018
  tension_absolue_max_V: null
  protection_surtension:
    existe: true
    detail: Registre 14 (0x0E) « Maximum Input Voltage », unite 0,1 V, lecture/ecriture, valeur initiale « – » (non
      publiee) ; registre 15 « Minimum Input Voltage » initial 40 (4,0 V). Condition de decharge (unload) BIT0 =
      protection de tension.
    seuil_C018_V: null
    analogie_7v4: 'Version 7,4 V (fiche STS3215 traduite) : protection si > 7,4 V ou < 4 V, seuil personnalisable.
      Non transposable a la C018.'
  comparaison_12v6: 12,6 V = borne haute de la plage Waveshare (marge nulle) ; sous 14 V (OpenELAB, AIFitLab). Seuil
    du registre 14 de la C018 inconnu.
  sources:
  - champ: plage_publiee_V
    via: r.jina.ai
    source: marche_3s_openelab_sts3215
  - champ: plage_publiee_V
    via: r.jina.ai
    source: marche_3s_aifitlab_sts3215
  - champ: plage_publiee_V
    via: direct
    source: marche_3s_waveshare_st3215_wiki
  - champ: plage_publiee_V
    via: direct
    source: marche_3s_waveshare_st3215_prod
  - champ: variante_voisine
    via: direct
    source: marche_3s_comet_c047
  - champ: protection_surtension
    via: direct
    source: marche_3s_aifitlab_memtable
  - champ: analogie_7v4
    via: direct
    source: marche_3s_coreel_sts3215_74
- modele: Feetech STS3250 12 V
  reference: ST-3250-C002
  plage_publiee_V:
  - min: 6
    max: 12
    ou: 'OpenELAB : « Listed operating voltage 6-12 V » ; FAQ : « The original C002 listing specifies 6-12 V »'
  - min: 6
    max: 12
    ou: 'AIFitLab : « Operating Voltage Range 6-12V »'
  - min: 6
    max: 12
