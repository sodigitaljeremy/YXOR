# Nomenclature des articulations. `nom` fait foi partout : CAO, URDF, code de
# contrôle. Aucune variante locale, aucun renommage silencieux (règle 3).
#
# STATUT (fiche 0005) : TOPOLOGIE TODDLERBOT ADOPTÉE EN P1, et non l'anatomie
# cible de YXOR. Réévaluable en P2, et à ce moment seulement.
#
# ── CINQ IDENTITÉS, VOLONTAIREMENT SÉPARÉES (fiche 0007) ──────────────────
#
#   fonction      CE QUE l'articulation fait. Anatomique, stable.
#   articulation  OÙ le mouvement se produit : axe, sens, butées.
#   actionnement  COMMENT il est produit : moteurs, transmission, rapport.
#   modele        CE QUE LA SIMULATION REPRÉSENTE — elle peut simplifier.
#   materiel      LE MATÉRIEL RÉEL. Jamais sans `source` NI `version`.
#
# ⚠ `version` est OBLIGATOIRE dans tout bloc `materiel`.
#   UNE AFFIRMATION SANS VERSION EST UNE AFFIRMATION PÉRIMABLE.
#   Cas d'école, le genou : « liaison parallèle déportant le moteur vers la
#   hanche » était VRAIE pour ToddlerBot 1.0 et FAUSSE pour la 2.0, qui a
#   supprimé les bielles. Sans champ `version`, rien ne signalait que
#   l'affirmation avait cessé d'être vraie.
#
# `confiance` — quatre valeurs, et quatre seulement :
#   documentee        une source amont citée l'affirme explicitement
#   deduite_du_modele seul le MJCF l'atteste. Il REPRÉSENTE, il ne DÉCRIT pas.
#   releve_onshape    relevé ponctuel daté (fiche 0007). Jamais en masse.
#   inconnue          aucune source. `source: null` obligatoire.
#
# ── RECOUPEMENT ───────────────────────────────────────────────────────────
#
# Là où une transmission a un rapport constant, les butées se vérifient par
# un SECOND chemin, indépendant de leur extraction : course du moteur ×
# rapport de réduction. Deux méthodes qui convergent valent mieux qu'une
# source. Le bloc `recoupement` consigne ce calcul là où il existe, et dit
# pourquoi il ne s'applique pas ailleurs.
#
# Butées extraites de params/upstream_joints.generated.yaml (commit amont
# e337f3b177b4b53abff70b31d1695a7b66cc6d2e), section `articulations` — jamais des `actionneurs`.
# Régénérer et revérifier :
#     .venv/bin/python scripts/import_upstream_limits.py --check

convention:
  unites_angles: degres
  repere: "x avant, y gauche, z haut"
  suffixes: [_left, _right]
  version_materiel_de_reference: "ToddlerBot 2.0.0"   # CHANGELOG amont, 2025-08-25

symetrie:
  # Les 13 paires gauche/droite sont exactement images l'une de l'autre :
  # c'est ce qui autorise UN SEUL jeu de butées ici. Un axe de rotation est
  # un vecteur AXIAL, il devient (-x, +y, -z) sous réflexion sagittale ;
  # comparer les butées sans ce signe fait conclure à tort à une asymétrie.
  plan: sagittal
  regle_axe: "axe_droit = (-x, +y, -z) de laxe gauche"
  regle_butees: "si laxe droit est lopposé du miroir, butées = [-max_g, -min_g]"
  verifie_par: scripts/import_upstream_limits.py
  verifie_le: 2026-09-28

jambes:          # 6 DDL par jambe
  - nom: hip_yaw
    fonction: >
      Rotation de la jambe autour de son axe vertical : oriente le pied vers l'intérieur ou l'extérieur.
    articulation:
      axe: z
      sens: -1
      min: -90.0
      max: 90.0
      source: upstream_joints.generated.yaml#articulations/left_hip_yaw_driven
    actionnement:
      moteurs: [left_hip_yaw_drive]
      transmission: engrenage
      rapport: 0.85714286
      source: upstream_joints.generated.yaml#actionneurs/left_hip_yaw_drive
    recoupement:
      methode: "course moteur × rapport"
      course_moteur: [-105.0, 105.0]
      butees_predites: [-90.0, 90.0]
      butees_extraites: [-90.0, 90.0]
      resultat: converge
    modele:
      representation: equality/joint
      source: "MJCF toddlerbot_2xc.xml @ e337f3b1"
    materiel:
      transmission: engrenage
      version: "ToddlerBot 2.0.0"
      confiance: deduite_du_modele
      source: "corroboration partielle : amont CHANGELOG.md 2.0.0, section Pelvis — « Optional metal bevel gears ». Confirme un engrenage conique au bassin, SANS nommer cette articulation."
  - nom: hip_roll
    fonction: >
      Écartement de la jambe sur le côté, et retour vers l'axe du corps.
    articulation:
      axe: x
      sens: +1
      min: -45.0
      max: 90.0
      source: upstream_joints.generated.yaml#articulations/left_hip_roll
    actionnement:
      moteurs: [left_hip_roll]
      transmission: directe
      rapport: 1.0
      source: upstream_joints.generated.yaml#actionneurs/left_hip_roll
    recoupement:
      methode: null
      resultat: sans_objet   # moteur et articulation confondus
    modele:
      representation: articulation_directe
      source: "MJCF toddlerbot_2xc.xml @ e337f3b1"
    materiel:
      transmission: directe
      version: "ToddlerBot 2.0.0"
      confiance: deduite_du_modele
      source: null
      note: >
        Aucune source matérielle. La doc amont ne décrit pas ce mécanisme.
        NE PAS dessiner de support moteur sur la foi de ce bloc : ouvrir
        Onshape ponctuellement (fiche 0007) et consigner la date.
  - nom: hip_pitch
    fonction: >
      Balancement de la jambe vers l'avant et vers l'arrière — le moteur du pas.
    articulation:
      axe: y
      sens: +1
      min: -135.0
      max: 105.0
      source: upstream_joints.generated.yaml#articulations/left_hip_pitch
    actionnement:
      moteurs: [left_hip_pitch]
      transmission: directe
      rapport: 1.0
      source: upstream_joints.generated.yaml#actionneurs/left_hip_pitch
    recoupement:
      methode: null
      resultat: sans_objet   # moteur et articulation confondus
    modele:
      representation: articulation_directe
      source: "MJCF toddlerbot_2xc.xml @ e337f3b1"
    materiel:
      transmission: directe
      version: "ToddlerBot 2.0.0"
      confiance: deduite_du_modele
      source: null
      note: >
        Aucune source matérielle. La doc amont ne décrit pas ce mécanisme.
        NE PAS dessiner de support moteur sur la foi de ce bloc : ouvrir
        Onshape ponctuellement (fiche 0007) et consigner la date.
  - nom: knee
    fonction: >
      Flexion et extension de la jambe entre cuisse et tibia.
    articulation:
      axe: y
      sens: -1
      min: -120.0
      max: 0.0
      source: upstream_joints.generated.yaml#articulations/left_knee
    actionnement:
      moteurs: [left_knee]
      transmission: directe
      rapport: 1.0
      source: upstream_joints.generated.yaml#actionneurs/left_knee
    recoupement:
      methode: null
      resultat: sans_objet   # moteur et articulation confondus
    modele:
      representation: articulation_directe
      source: "MJCF toddlerbot_2xc.xml @ e337f3b1"
    materiel:
      transmission: directe
      version: "ToddlerBot 2.0.0"
      confiance: documentee
      source: "amont CHANGELOG.md 2.0.0, section Leg — « Simplified knee design (removed parallel links) »"
      note: >
        La 1.0 utilisait des bielles parallèles ; la 2.0 les a supprimées. La note antérieure de ce fichier décrivait la 1.0 : vraie alors, fausse aujourd'hui.
  - nom: ankle_pitch
    fonction: >
      Bascule du pied vers le haut ou vers le bas ; règle l'attaque du pas.
    articulation:
      axe: y
      sens: +1
      min: -105.0
