# Total : 6×2 + 7×2 + 2 + 2 = 30 DDL actifs.

particularites:
  elbow_roll: >
    Malgré le nom, ce n'est pas un coude humain. Bras le long du corps, il
    écarte l'avant-bras LATÉRALEMENT, pas vers l'avant : rotation autour de x.
    Vérifié par trois voies concordantes — le modèle, le calcul (la coordonnée
    x de la main reste constante sur toute la course) et l'image. Le lacet
    d'épaule situé au-dessus oriente le plan de flexion ; le coude n'en a pas
    de fixe dans le repère du robot.
  elbow_yaw: >
    Nommée wrist_yaw avant la fiche 0005. L'axe z était juste, c'est
    l'emplacement qui était faux : ce lacet est au coude, pas au poignet.
  knee: >
    Actionnement DIRECT depuis ToddlerBot 2.0, qui a supprimé les bielles
    parallèles de la 1.0. Butée haute à 0° : c'est une butée mécanique réelle,
    utilisée comme référence de calibration par la doc amont
    (docs/tools/01_zero_point_calibration.rst).
  neck_pitch: >
    Bielle à quatre barres : moteur neck_pitch_act, articulation neck_pitch,
    bielles neck_pitch_front et neck_pitch_back, fermées par quatre contraintes
    de site dans le MJCF.
  waist_yaw / waist_roll: >
    Différentiel : deux moteurs tournant tous deux autour de z. Leur SOMME
    produit le lacet, leur DIFFÉRENCE le roulis. Aucun des deux moteurs ne
    correspond à un degré de liberté anatomique.
