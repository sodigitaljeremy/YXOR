# Marché des calculateurs — lu par scripts/marche_composants.py
#
# DONNÉES SEULEMENT (2026-10-07) : aucune intégration à l'explorateur, aucun achat (fiche 0066).
# Contexte DÉCIDÉ (fiche 0070, Jeremy, 2026-10-07) : « Les deux robots, YXOR Lab et YXOR, fonctionnent
# entièrement sur batterie. Je préfère NVIDIA Jetson, mais je veux une comparaison chiffrée avec le
# Raspberry Pi 5 et ses cartes d'IA. »
#
# Même méthode que le marché des actionneurs : une valeur non lue est null ; deux sources qui divergent,
# la plus prudente (fiche 0064), l'autre en note. Relevé par quatre agents de Claude Code le 2026-10-07 ;
# chaque source est TÉLÉCHARGÉE (hors du dépôt) et inscrite au registre params/fournisseurs.yaml sous
# la clé citée ici (marche_<domaine>_<id>), redistribuable: false. Les valeurs dérivées (énergie non
# publiée, volume, densités, CHF HT, TOPS/W, canaux CAN) sont CALCULÉES par scripts/marche_composants.py,
# jamais déclarées ici.
#
# TOPS : un chiffre « AI Performance » n'est comparable qu'en INT8 DENSE ; voir meta.mises_en_garde_tops.

meta:
  perimetre: C — calculateurs embarqués (Jetson, Raspberry Pi et IA), relevé du 2026-10-07
  conventions:
  - valeur null = non lue dans une source téléchargée ; aucune estimation.
  - 'tva_incluse : false si la source dit HT ; un taux (0.20) quand il se déduit des prix TTC et HT affichés ; true
    si la source dit TTC sans taux ; null si la source ne dit rien (prix MSRP NVIDIA et prix de liste Raspberry
    Pi).'
  - 'Deux sources divergentes : valeur la plus prudente retenue, l''autre en note.'
  - Fichiers sources dans fichiers/ ; empreinte sha256 et taille calculées au moment de la génération.
  mises_en_garde_tops:
  - 'NVIDIA Orin : « AI Performance » = INT8 SPARSE, GPU + DLA additionnés. Le dense vaut la moitié ; GPU seul en
    INT8 dense : Nano 4GB 17, Nano 8GB 33, NX 38, AGX 32GB 54, AGX 64GB 85, Industrial 78.'
  - La page du kit Orin Nano Super écrit « 67 INT8 TOPS » sans le mot sparse ; le fiche J401 de Seeed donne encore
    les TOPS d'avant Super (20/40/70/100).
  - 'NVIDIA Thor (T2000–T5000) : TFLOPS FP4 SPARSE seulement, aucune valeur INT8 publiée sur les pages lues ; «
    7.5x AGX Orin » compare FP4 sparse à INT8 sparse.'
  - 'AI HAT+ 2 (Hailo-10H) : 40 TOPS en INT4 ; vision « comparable » à l''AI HAT+ 26 TOPS.'
  - 'Hailo-8 / 8L (AI HAT+) : précision et parcimonie non publiées par Raspberry Pi.'
  - 'AGX Orin 32GB : la même page NVIDIA donne 241 puis 200 TOPS : 200 retenu.'
  contexte_marche_2026:
  - Hausse NVIDIA de juillet 2026 (jusqu'à +101 %), ex. kit Orin Nano Super 249 $ → 399 $ (nv_faq, cnx_prix).
  - Fin de vie accélérée des Jetson LPDDR4 (TX2 NX, TX2i, AGX Xavier, Xavier NX), dernière livraison 15/07/2027
    (cnx_lpddr4_eol).
  - 'Nouveautés 2026 : T4000 (en vente), T3000 et T2000 annoncés pour T1 2027 ; AI HAT+ 2 (Hailo-10H) ; brief RPi
    5 d''octobre 2026 (16GB à 305 $).'
  - 'Raspberry Pi AI Kit : fin de production.'
  trous:
  - 'Masses des modules Jetson et des kits NVIDIA : non publiées sur les pages lues (fiches techniques derrière
    inscription).'
  - 'Consommation au repos et typique : aucune valeur fabricant pour Jetson ni Raspberry Pi (seulement des plages
    de modes).'
  - 'Hailo-8 M.2 seul et pages hailo.ai : bloquées (403), non relevées.'
  - 'Pages raspberrypi.com, pi-shop.ch, digitec.ch, connecttech.com : protection anti-robot, non téléchargées. Aucun
    prix suisse relevé.'
  - 'ONNX Runtime : non vérifié. Tensions d''entrée des kits NVIDIA : non lues.'
