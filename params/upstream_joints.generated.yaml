# ╔══════════════════════════════════════════════════════════════════╗
# ║  FICHIER GÉNÉRÉ — NE PAS ÉDITER À LA MAIN                        ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# Commit amont : e337f3b177b4b53abff70b31d1695a7b66cc6d2e
# Épinglé par  : decisions/archive/0002-pin-toddlerbot.md
# Modèle       : toddlerbot/descriptions/toddlerbot_2xc/scene.xml
# Extrait le   : 2026-09-28 13:04:24 +0200
# Par          : scripts/import_upstream_limits.py (MuJoCo 3.13.0)
#
# Commité par exception au principe de la règle 4, parce qu'il dérive
# d'un dépôt externe et ne serait pas régénérable si celui-ci
# disparaissait — voir decisions/archive/0006-fichier-genere-commite.md.
#
# ── Deux sections, et il ne faut surtout pas les confondre ──────────
#
# actionneurs  : les 30 MOTEURS. C'est ce que la commande pilote.
# articulations: les 30 DEGRÉS DE LIBERTÉ du squelette. C'est ce que
#                params/joints.yaml décrit.
#
# Quand l'actionnement est direct, les deux coïncident. Quand il passe
# par une liaison parallèle, ils DIFFÈRENT — et les butées aussi :
# le moteur de taille tourne de ±268°, le torse ne pivote que de ±90°.
# Remplir joints.yaml depuis la section `actionneurs` donnerait donc
# des butées fausses d'un facteur 3. Utiliser `articulations`.
#
# bielles      : pièces internes des liaisons parallèles. Ni moteurs
#                ni degrés de liberté anatomiques. Listées pour
#                l'exhaustivité, à ignorer pour la nomenclature.
#
# axe_corps : axe de rotation dans le repère du CORPS porteur (donnée
#             brute du MJCF, non interprétée).
# axe_monde : le même axe dans le repère du MONDE, à la pose par
#             défaut. C'est celui-ci qui dit autour de quel axe
#             PHYSIQUE l'articulation tourne.
#             Repère : x avant, y gauche, z haut.
#             Un signe négatif inverse le sens positif, pas l'axe.
# min/max   : butées en degrés, telles qu'écrites dans le modèle.
#
# 30 actionneurs, 30 articulations, 2 bielles.

