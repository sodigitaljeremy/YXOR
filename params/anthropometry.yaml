# Source de vérité dimensionnelle du projet YXOR.
# Changer H et régénérer suffit à produire une autre taille de robot.
#
# ─────────────────────────────────────────────────────────────────────────
#  HISTORIQUE — à lire avant de faire confiance à ce fichier
# ─────────────────────────────────────────────────────────────────────────
#  Ces valeurs ont d'abord été ÉCRITES DE MÉMOIRE PAR UN MODÈLE DE LANGAGE
#  le 2026-09-20, sans confrontation à la source. Elles ont été vérifiées
#  le 2026-09-28 contre Winter, « Biomechanics and Motor Control of Human
#  Movement », chapitre 4. Voir decisions/archive/0012 et le journal du jour.
#
#  L'attribution d'origine était FAUSSE : le fichier annonçait
#  « Drillis & Contini » pour tout. C'est vrai des longueurs, faux des
#  masses, qui sont de Dempster.
#
# ─────────────────────────────────────────────────────────────────────────
#  DEUX FAMILLES, DEUX SOURCES — elles ne se recouvrent pas
# ─────────────────────────────────────────────────────────────────────────
#  ratios.*  longueurs, en fraction de H
#            Drillis & Contini (1966), via Winter figure 4.1.
#            ⚠ VALEURS NON VÉRIFIÉES : la figure 4.1 est un GRAPHIQUE,
#              aucun de ces nombres n'apparaît dans le texte du document.
#              La source primaire (Office of Vocational Rehabilitation,
#              New York) n'est pas accessible. L'attribution est établie,
#              les valeurs ne le sont pas. Chaque ligne porte `verifie`.
#
#  NB : `verifie` est un BOOLÉEN YAML (true/false), pas `oui`/`non` —
#  ces derniers seraient lus comme des CHAÎNES, et la chaîne "non" est
#  VRAIE en Python. Un test naïf aurait conclu l'inverse.
#
#  masses.*  fractions de la masse totale du corps
#            Dempster (1955), via Winter tableau 4.1, code `M`
#            (Dempster via Miller & Nelson). VALEURS VÉRIFIÉES.
#
#  Origine au sens de la fiche 0010 : `litterature` pour les deux familles.
#  Nature au sens de la fiche 0013 : `echelle` — la règle 1 s'y applique.

H: 0.56                  # mètres — taille de ToddlerBot, RÉFÉRENCE du calcul
                         # ⚠ ORIGINE AMONT : c'est la taille publiée de
                         # ToddlerBot (fiches 0055 et 0058). Ce n'est plus
                         # la taille de YXOR, ni un palier.

# PALIERS REMPLACÉS le 2026-09-30 par les tailles (fiche 0055, qui remplace
# la 0001 ; tailles décidées par la 0048). Ancien bloc, conservé :
#   paliers:
#     P1: 0.56               # amont — identique à H
#     P2: 0.90               # propre — choix de projet
#     P3: 1.70               # propre — choix de projet
#
# Tailles : ORDRE DE GRANDEUR du cadrage § 6, que dimensionnement.py affine
# (fiche 0047). Une pièce ne se dessine qu'à une taille qui a une valeur unique.
#
# MODIFIÉ le 2026-10-01 (refonte R3, fiche 0065, décidée par Jeremy). Ancien
# texte : S {H_m: [0.55, 0.60], classe: "S (EduLite 05, RS05, J4310… —
# famille non décidée)"}. H_S = 0,60 m est VISÉE : si la marge ne tient pas
# avec charge utile et relevé (docs/choix-actionneurs.md), on redescend vers
# `H_m_repli` (fiche 0065, condition a).
tailles:
  S:  {H_m: 0.60, H_m_repli: 0.55, classe: "S (RobStride RS00, 12 articulations de jambe ; fiche 0065)"}
  M:  {H_m: 0.80, classe: "M (RS02 ou équivalent)"}
  L:  {H_m: 0.90, classe: "L (RS06 ou mixte RS06/RS02)"}
  XL: {H_m_min: 1.0, classe: "XL (RS03 et au-delà), hors programme"}

# ═════════════════════════════════════════════════════════════════════════
#  LONGUEURS — ANSUR II (2012), recalculées depuis les données brutes
#  Remplacent Drillis & Contini le 2026-09-29 — fiche 0034.
#
#  Recalculables à tout moment :
#      .venv/bin/python scripts/ratios_ansur.py
#
#  Les quatorze ratios venaient d'un GRAPHIQUE (Winter fig. 4.1), donc
#  invérifiables : le fichier les portait avec `verifie: false`, quatorze
#  fois. Ils viennent maintenant de 93 mesures directes sur 6 068
#  personnes, en CSV public. On ne croit plus un graphique sur parole.
#
#  DEUX RÉSERVES, qui ne sont pas des détails :
#    1. population MILITAIRE américaine, explicitement non représentative
#       de la population générale — sélection physique, âge resserré ;
#    2. ANSUR ne donne que des LONGUEURS. Les masses viennent de
#       dissections : elles restent chez Dempster (bloc `masses`).
#
#  Deux ratios ne sont pas dérivables d'ANSUR et restent chez D&C, avec
#  leur `verifie: false` : `tete_hauteur` et `cou_hauteur`.
# ═════════════════════════════════════════════════════════════════════════
ratios:
  hauteur_hanche:
    valeur: 0.5149
    source: "ANSUR II 2012, +trochanterionheight / stature"
    verifie: true
    ecart_type: 0.0152
    effectif: 6068
    note: "hauteur du grand trochanter"
  cuisse:
    valeur: 0.2476
    source: "ANSUR II 2012, +trochanterionheight -tibialheight / stature"
    verifie: true
    ecart_type: 0.0113
    effectif: 6068
    note: "trochanter moins tibiale : le fémur"
  tibia:
    valeur: 0.2267
    source: "ANSUR II 2012, +tibialheight -lateralmalleolusheight / stature"
    verifie: true
    ecart_type: 0.0088
    effectif: 6068
    note: "tibiale moins malléole : la jambe"
  pied_longueur:
    valeur: 0.1534
    source: "ANSUR II 2012, +footlength / stature"
    verifie: true
    ecart_type: 0.0055
    effectif: 6068
    note: "mesure directe"
  pied_largeur:
    valeur: 0.0577
    source: "ANSUR II 2012, +footbreadthhorizontal / stature"
    verifie: true
    ecart_type: 0.0029
    effectif: 6068
    note: "mesure directe"
  cheville_hauteur:
    valeur: 0.0405
    source: "ANSUR II 2012, +lateralmalleolusheight / stature"
    verifie: true
    ecart_type: 0.0032
    effectif: 6068
    note: "hauteur de la malléole latérale"
  largeur_epaules:
    valeur: 0.2328
    source: "ANSUR II 2012, +biacromialbreadth / stature"
    verifie: true
    ecart_type: 0.0114
    effectif: 6068
    note: "d'un acromion à l'autre"
  largeur_bassin:
    valeur: 0.2036
    source: "ANSUR II 2012, +hipbreadth / stature"
    verifie: true
    ecart_type: 0.0167
    effectif: 6068
    note: "mesure directe, debout"
  tronc_hauteur:
    valeur: 0.3052
    source: "ANSUR II 2012, +acromialheight -trochanterionheight / stature"
    verifie: true
    ecart_type: 0.0154
    effectif: 6068
    note: "épaule moins hanche — DIRECTE ici, dérivée chez D&C"
  bras:
    valeur: 0.1909
    source: "ANSUR II 2012, +acromionradialelength / stature"
    verifie: true
    ecart_type: 0.0062
    effectif: 6068
    note: "acromion à radiale : le bras"
  avant_bras:
    valeur: 0.1511
    source: "ANSUR II 2012, +radialestylionlength / stature"
    verifie: true
    ecart_type: 0.0067
    effectif: 6068
    note: "radiale à stylion : l'avant-bras"
  main_longueur:
    valeur: 0.1104
    source: "ANSUR II 2012, +handlength / stature"
    verifie: true
    ecart_type: 0.0044
    effectif: 6068
    note: "mesure directe"
  tete_hauteur:
    valeur: 0.130    # CONSERVÉE de Drillis & Contini
    source: "D&C fig. 4.1 — non dérivable d'ANSUR II"
    verifie: false
    note: >
      ANSUR mesure le tragion et la cervicale, pas le menton ni le vertex sur la même verticale
  cou_hauteur:
    valeur: 0.052    # CONSERVÉE de Drillis & Contini
    source: "D&C fig. 4.1 — non dérivable d'ANSUR II"
    verifie: false
    note: >
      même raison : aucune mesure ANSUR n'isole le cou


masses:

  main:         { valeur: 0.006,  source: "Winter tab. 4.1 — Hand",      verifie: true }
  avant_bras:   { valeur: 0.016,  source: "Winter tab. 4.1 — Forearm",   verifie: true }
  bras:         { valeur: 0.028,  source: "Winter tab. 4.1 — Upper arm", verifie: true }
  pied:         { valeur: 0.0145, source: "Winter tab. 4.1 — Foot",      verifie: true }
  tibia:        { valeur: 0.0465, source: "Winter tab. 4.1 — Leg",       verifie: true }
  cuisse:       { valeur: 0.100,  source: "Winter tab. 4.1 — Thigh",     verifie: true }
  tronc:        { valeur: 0.497,  source: "Winter tab. 4.1 — Trunk",     verifie: true }

  tete_et_cou:
    valeur: 0.081
    source: "Winter tab. 4.1 — Head AND neck"
    verifie: true
    note: >
      Nommée `tete` jusqu'au 2026-09-28, ce qui était FAUX : la ligne de
      Winter couvre la tête ET le cou. L'employer pour la tête seule
      surestime son inertie. Dempster ne donne pas le partage entre les
      deux : le scinder exigerait d'inventer une valeur.
      Aucune contradiction avec ratios.cou_hauteur — celle-ci est une
      LONGUEUR, celle-là une MASSE. Aucune relation ne les lie.

# ─────────────────────────────────────────────────────────────────────────
#  CONTRÔLE DE COHÉRENCE — doit valoir exactement 1
# ─────────────────────────────────────────────────────────────────────────
#    2 x (main + avant_bras + bras + pied + tibia + cuisse)
#      + tronc + tete_et_cou
#  = 2 x (0.006 + 0.016 + 0.028 + 0.0145 + 0.0465 + 0.100)
#      + 0.497 + 0.081
#  = 2 x 0.2110 + 0.578
#  = 1.000000                                    vérifié le 2026-09-28
#
#  Avant correction la somme faisait 0.988 : il manquait exactement deux
#  mains à 0.006. C'est ce qui a permis d'établir que la série était bien
#  celle de Dempster, complète, moins les mains.
#  Toute modification future qui romprait cette égalité est un défaut.

# Rappel : entre deux paliers de rapport k, la masse varie en k^3 et le couple
# articulaire requis en k^4. Ces ratios mettent les pièces à l'échelle, pas les
# actionneurs — et ils ne dimensionnent AUCUNE cote de tenue (fiche 0013).
