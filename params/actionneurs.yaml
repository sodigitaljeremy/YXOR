# ═════════════════════════════════════════════════════════════════════════
#  Configurations nommées — calculées et publiées au cadrage § 5
# ═════════════════════════════════════════════════════════════════════════
#  Une configuration donne la classe de chaque type d'articulation de
#  jambe (les deux côtés ont la même). `lourde` va sur `articulations_lourdes`,
#  `legere` ailleurs. Le statut est celui du cadrage, pas une décision ici.
configurations_nommees:
  S_rs05:
    libelle: "S — RS05 homogène"
    statut: "classe de S ouverte (cadrage § 6) ; calcul demandé le 2026-09-30"
    lourde: rs05
    legere: rs05
    articulations_lourdes: []
  L_rs06_rs02:
    libelle: "L — RS06 sur la hanche (3 axes), le genou et le tangage de cheville ; RS02 sur le roulis de cheville"
    statut: "calcul demandé le 2026-09-30 (question ouverte 3 du cadrage)"
    lourde: rs06
    legere: rs02
    articulations_lourdes: [hip_roll, hip_pitch, hip_yaw_drive, knee, ankle_pitch]

# ═════════════════════════════════════════════════════════════════════════
#  Référence du modèle de masse : ToddlerBot (P1)
# ═════════════════════════════════════════════════════════════════════════
reference_toddlerbot:
  hauteur_m: {valeur: 0.56, source: "fiche 0001 ; arXiv 2502.00893v1 : 0,56 m", consulte_le: "2026-09-30"}
  masse_totale_kg: {valeur: 3.454, source: "somme des body_mass du MJCF toddlerbot_2xc.xml @ e337f3b (MuJoCo 3.13.0)", consulte_le: "2026-09-30", note: "l'article arXiv 2502.00893v1 dit 3,4 kg"}
  # Masse PAR AXE. Les 2XC430 et 2XL430 sont des boîtiers à DEUX axes :
  # un seul 2XC430 de 102 g porte le roulis ET le tangage de hanche
  # (arXiv 2502.00893v1, § VIII-E : « 2XC430-W250 — Hip RP »).
  # Compter 102 g par actionneur doublerait sa masse.
  masse_dynamixel_g:
    XC330:      {valeur: 23,   source: "https://emanual.robotis.com/docs/en/dxl/x/xc330-t288/", consulte_le: "2026-09-30", note: "XC330-T288"}
    XC430:      {valeur: 65,   source: "https://emanual.robotis.com/docs/en/dxl/x/xc430-t240bb/", consulte_le: "2026-09-30", note: "XC430-T240BB, celui cité par l'article"}
    XM430-W210: {valeur: 82,   source: "https://emanual.robotis.com/docs/en/dxl/x/xm430-w210/", consulte_le: "2026-09-30"}
    2XC430:     {valeur: 51,   source: "https://emanual.robotis.com/docs/en/dxl/x/2xc430-w250/", consulte_le: "2026-09-30", note: "102 g le boîtier, divisé par ses 2 axes"}
    2XL430:     {valeur: 49.1, source: "https://emanual.robotis.com/docs/en/dxl/x/2xl430-w250/", consulte_le: "2026-09-30", note: "98,2 g le boîtier, divisé par ses 2 axes"}

# ═════════════════════════════════════════════════════════════════════════
#  Contrôle de cohérence : des robots qui existent, dans leur classe
# ═════════════════════════════════════════════════════════════════════════
controle_coherence:
  toddlerbot:
    classe: toddlerbot          # ses Dynamixel, bornes du modèle de simulation amont
    hauteur_m: {valeur: 0.56, source: "fiche 0001", consulte_le: "2026-09-30"}
  zeroth01:
    classe: sts3250
    hauteur_m:
      valeur: 0.48
      source: "consigne de Jeremy, 2026-09-30"
      consulte_le: "2026-09-30"
      note: >
        ⚠ 0,48 m n'a été trouvé dans AUCUNE source. docs.kscale.dev ne
        résout plus (DNS). Un extrait de recherche de cette page et le
        README https://github.com/Justin-Riekehof/zeroth-01-build disent
        « ~40 cm ». La valeur la plus haute est gardée : le contrôle est
        ainsi le plus exigeant. Zeroth-01 a 5 DDL par jambe et non 6, et
        aucune marche RÉELLE n'a été vue, seulement en simulation (README
        Riekehof ; K-Scale annonce « basic locomotion »).
      autres_valeurs:
        - {valeur: 0.40, source: "https://github.com/Justin-Riekehof/zeroth-01-build/blob/main/README.md", consulte_le: "2026-09-30"}

