controle_coherence:
  toddlerbot:
    classe: toddlerbot          # ses Dynamixel, bornes du modèle de simulation amont
    hauteur_m: {valeur: 0.56, source: "fiche 0001", consulte_le: "2026-09-30"}
  zeroth01:
    classe: sts3250
    hauteur_m:
      valeur: 0.48
      source: "prompt de Claude (arbitrage), 2026-09-30 — PROPOSÉ (« consigne de Jeremy » jusqu'au 2026-09-30, 23 h 50)"
      consulte_le: "2026-09-30"
      note: >
        ⚠ 0,48 m n'a été trouvé dans AUCUNE source. docs.kscale.dev ne
        résout plus (DNS). Un extrait de recherche de cette page et le
        README https://github.com/Justin-Riekehof/zeroth-01-build disent
        « ~40 cm ». La valeur la plus haute est gardée : le contrôle est
        ainsi le plus exigeant. Zeroth-01 a 5 DDL par jambe et non 6, et
        aucune marche RÉELLE n'a été vue, seulement en simulation (README
        Riekehof ; K-Scale annonce « basic locomotion »).
      autres_valeurs:
        - {valeur: 0.40, source: "https://github.com/Justin-Riekehof/zeroth-01-build/blob/main/README.md", consulte_le: "2026-09-30"}

