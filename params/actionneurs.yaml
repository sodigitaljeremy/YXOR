      B_frequence_retour_bus: {valeur: "envoi périodique réglable de 1 à 2000 Hz, ou mode requête-réponse ; CAN 1 Mbps ; port série : position renvoyée toutes les 10 ms sur demande", source: "cubemars_ak_v3_2_0, p. 17, p. 46, p. 7, p. 49"}
      C_plaque_nominal: {valeur: null, source: null, note: "non trouvé pour l'AK45-10 dans manuel AK V3.2.0 ; les nominaux donnés concernent les cartes AK54/AK60/AK80, dont aucune n'est listée comme compatible avec l'AK45-10 (p. 7)"}
      C_conditions_continu: {valeur: null, source: null, note: "non trouvé dans manuel AK V3.2.0"}
      D_version_document: {valeur: "AK Series Module Product Manual V3.2.0 (2026.01.17)", source: "cubemars_ak_v3_2_0, p. 1 et p. 6"}
      D_revision_materielle: {valeur: null, source: null, note: "« V3.0 » de l'AK45-10 non trouvé dans manuel AK V3.2.0 ; le manuel mentionne seulement « Driver version: V3.0 » dans l'historique Ver.2.0.0 (p. 5)"}
      D_notes_de_version: {valeur: "oui, p. 5-6 : de Ver.2.0.0 (2023.10.18) à Ver3.2.0 (2026.01.17), aucune entrée ne concerne l'AK45", source: "cubemars_ak_v3_2_0, p. 5-6"}
      D_contradictions_internes: {valeur: "(1) Data[6] de la trame 0x29 : « Motor Temperature » (tableau) contre « driver board temperature » (texte), p. 46 ; (2) codeur interne : « 16 bits, jusqu'à 21 bits avec firmware spécial » (p. 4) contre « 21 bit » (p. 8) ; (3) numérotation des erreurs différente entre CAN (p. 47) et série (p. 50) ; (4) commentaires inversés COMM_SET_POS_MULTI / COMM_SET_POS_SINGLE (p. 48)", source: "cubemars_ak_v3_2_0, p. 4, 8, 46-48, 50"}
      E_watchdog: {valeur: null, source: null, note: "aucun délai de perte de communication CAN dans manuel AK V3.2.0 ; FAULT_CODE_BOOTING_FROM_WATCHDOG_RESET (p. 50) désigne un redémarrage du microcontrôleur, pas un délai de communication"}
