#  copies de session vérifiées par sha256. Proposition de critères et de
#  grilles : docs/criteres-manquants.md (PROPOSÉ). AUCUNE de ces valeurs
#  n'est lue par selection_multicritere.py : rien n'est noté ni recalculé.
#  Seul scripts/pertes_cuivre.py lit la famille G, pour information.
#
#  Règle de saisie : valeur trouvée = valeur + source « document, p. N » ;
#  sinon null + « non trouvé dans <documents lus> ». Jamais d'emprunt à un
#  modèle voisin. Pages = numéros du PDF (la pagination imprimée peut être
#  décalée). Relevé fait par trois agents de lecture, assemblé et
#  normalisé par Claude Code (nombres en nombres, unités en note).
#  STS3250 : aucun document au registre, donc tout est null.
