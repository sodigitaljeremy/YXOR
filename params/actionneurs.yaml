# Catalogue des actionneurs candidats — lu par scripts/dimensionnement.py
#
# ─────────────────────────────────────────────────────────────────────────
#  CE QUE CE FICHIER EST, ET N'EST PAS
# ─────────────────────────────────────────────────────────────────────────
#  Un relevé de caractéristiques CONSTRUCTEUR, chaque valeur avec sa
#  source et sa date de consultation. Ce n'est ni un choix ni une liste
#  d'achat (CLAUDE.md, règle d'achat c : un comparatif demandé, rien de
#  plus).
#
#  Règles de saisie :
#    · valeur inconnue = null, JAMAIS estimée ni prise sur un produit voisin ;
#    · valeur vue seulement dans un résumé de moteur de recherche, sans
#      page ouverte = null, et la lecture est notée dans `non_verifie` ;
#    · deux sources en désaccord : les deux sont portées, la valeur
#      retenue est dite et justifiée ;
#    · les unités d'ORIGINE sont conservées (rpm, s/60°, kg·cm) : la
#      conversion en rad/s ou N·m se CALCULE dans le script, elle ne se
#      déclare pas (CLAUDE.md, règle 3 des contrôles).
#
#  Vitesse : c'est la vitesse À VIDE. Sous charge, un actionneur tourne
#  moins vite : la contrainte de vitesse est donc optimiste.
#
#  Dépôt constructeur RobStride : https://github.com/RobStride/Product_Information
#  PDF « 灵足时代RS系列产品规格介绍(2026.09.17).pdf » — texte extrait avec
#  pypdf, pages de détail citées, et comparatif p. 38. robstride.com est
#  rendu en JavaScript et n'a PAS pu être lu automatiquement.

consultation: "2026-09-30"

# ═════════════════════════════════════════════════════════════════════════
#  Paramètres du dimensionnement — choix, pas mesures
# ═════════════════════════════════════════════════════════════════════════
dimensionnement:
  marge: 1.5                  # DÉCIDÉ par Jeremy le 2026-09-30 (fiche 0051), à revoir après le banc — pas une norme
  tolerance_coherence_m: 0.005
  # Configuration mixte : classe lourde ici, légère ailleurs (source :
  # prompt de Claude (arbitrage), 2026-09-30 — PROPOSÉ ; « consigne de Jeremy » jusqu'au 2026-09-30, 23 h 50).
  articulations_lourdes: [hip_roll, hip_pitch, knee, ankle_pitch]

