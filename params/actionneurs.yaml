      E_perte_can: {valeur: null, source: null, note: "non trouvé dans manuel AK V3.2.0"}
      E_bus_off: {valeur: null, source: null, note: "non trouvé dans manuel AK V3.2.0 (seulement la mention d'une interface CAN isolée, p. 4)"}
      E_protections: {valeur: "codes CAN, valables pour toute la série : surchauffe moteur, surintensité, surtension, sous-tension, codeur, surchauffe MOSFET, blocage moteur ; codes série : en plus défauts driver et grille, sous-tension MCU, flash, capteurs de courant, courants déséquilibrés. Aucun seuil, aucune réaction (coupure ou limitation) documentés. Seul chiffre : température max de la carte driver 100 °C, pour les cartes AK54/60/80", source: "cubemars_ak_v3_2_0, p. 47, p. 50-51, p. 8"}
