# Pourquoi telle valeur est absente — voir decisions/0020-nullite-conditionnelle.md
#
# Un `null` n'a pas un sens, il en a trois. Les confondre fait annoncer du
# travail là où il n'y en a pas, ou taire du travail qu'il y a.
#
#   a_mesurer   rien ne l'empêche, personne ne l'a fait   -> aller mesurer
#   sans_objet  la notion n'existe pas ICI, à cause       -> rien à faire
#               d'un AUTRE champ
#   se_deduira  dérive d'un autre champ, lui-même absent  -> remplir l'autre
#
# `a_mesurer` est le DÉFAUT : un null non déclaré ressort en rouge. Même
# principe que `non_qualifie` dans l'audit — l'oubli se voit.
#
# `motif` : chemin de clé, `*` joker sur un segment, `**` sur plusieurs.
#           Le PREMIER motif qui correspond gagne : du plus précis au
#           plus général.
# `si`    : condition portant sur une clé SŒUR de la valeur nulle.
#           Sans `si`, la règle s'applique toujours.
# `parce_que` : la phrase affichée. Elle doit NOMMER l'autre champ, sinon
#           le lecteur voit un état sans en voir la cause.

fichiers:

  # ═══════════════════════════════════════════════════════════════════════
  #  Bloc `piece:` des relevés parts/<nom>.origines.yaml
  # ═══════════════════════════════════════════════════════════════════════
  piece:
    regles:
      - motif: "orientation_cannelures_deg"
        si: {cle: anisotrope, vaut: false}
        etat: sans_objet
        parce_que: >
          le matériau est isotrope (`anisotrope: false`) : il n'a pas de
          cannelures, donc pas d'orientation. Ce n'est pas une mesure qui
          manque, c'est une notion qui n'existe pas pour cette matière.

  # ═══════════════════════════════════════════════════════════════════════
  #  params/hardware.yaml
  # ═══════════════════════════════════════════════════════════════════════
  hardware.yaml:
    regles:

      # ── Champs de PROSE : ce ne sont pas des valeurs ──────────────────
      - motif: "**.note"
        etat: sans_objet
        parce_que: "champ de prose, pas une valeur à relever"
      - motif: "**.note_anisotropie"
        etat: sans_objet
        parce_que: "champ de prose, pas une valeur à relever"
      - motif: "**.mesure_epaisseur"
        etat: sans_objet
        parce_que: "protocole de mesure, pas une valeur à relever"
      - motif: "**.axe_reference"
        etat: sans_objet
        parce_que: "désignation d'un axe, pas une valeur à relever"
      - motif: "**.motif"
        etat: sans_objet
        parce_que: >
          motif d'un réglage déclaré impossible : c'est une explication,
          pas une cote qui manque

      # ── Un réglage IMPOSSIBLE n'a pas de cotes manquantes ─────────────
      # Ses nuls ne sont pas « à mesurer » : il n'y a rien à mesurer sur
      # un couple qui n'existe pas. C'est la distinction de la fiche 0020
      # portée au niveau du réglage entier.
      - motif: "reglages.**"
        si: {cle: valide, vaut: false}
        etat: sans_objet
        parce_que: >
          ce réglage est déclaré impossible : aucune de ses cotes n'a de
          sens, et aucune n'est à mesurer

      # ── Rayon intérieur minimal : DEUX raisons distinctes ─────────────
      # Ordre important, et la première règle emploie un CHEMIN ABSOLU
      # (fiche 0033) : la machine n'est plus une clé sœur du réglage
      # depuis le passage à quatre tables.
      - motif: "reglages.cousin_alu_3.rayon_interieur_min"
        si: {chemin: "machines.decoupe_cousin.nom", vaut: null}
        etat: se_deduira
        parce_que: >
          il dépend du moyen de découpe, et `machines.decoupe_cousin.nom`
          n'est pas encore établi. Un jet d'eau, un laser et un plasma ne
          donnent pas le même rayon minimal. Rien à mesurer tant que le
          moyen est inconnu.
      - motif: "reglages.*.rayon_interieur_min"
        si: {cle: epaisseur, vaut: null}
        etat: se_deduira
        parce_que: >
          il vaut 0,5 x `epaisseur` (CLAUDE.md), et l'épaisseur de la
          matière n'est pas encore mesurée. Il suivra tout seul : ce n'est
          pas une seconde mesure à faire.

      # ── La source d'une mesure vient AVEC la mesure ───────────────────
      - motif: "reglages.*.source_saignee"
        si: {cle: saignee, vaut: null}
        etat: se_deduira
        parce_que: >
          une mesure non faite n'a pas de source. Elle se renseignera en
          même temps que `saignee`.

      # ── Matières et matériaux ─────────────────────────────────────────
      - motif: "matieres.*.masse_surfacique"
        si: {cle: epaisseur, vaut: null}
        etat: se_deduira
        parce_que: >
          la masse surfacique se relève sur une feuille dont l'épaisseur
          est connue. Tant que `epaisseur` est absente, il n'y a pas de
          feuille définie à peser.

      - motif: "matieres.*.densite"
        etat: se_deduira
        parce_que: >
          densité = `masse_surfacique` / `epaisseur_mesuree`, toutes deux
          portées par la MATIÈRE. C'est un quotient de deux mesures, pas
          une troisième mesure. La compter « à mesurer » gonflerait le
          travail restant.

      - motif: "materiaux.*.source"
        etat: se_deduira
        parce_que: >
          le matériau n'est pas encore caractérisé. La source se
          renseignera avec le premier relevé qui le concerne.

      # ── Machine du cousin : ce n'est pas une mesure, c'est un fait ────
      - motif: "machines.decoupe_cousin.nom"
        etat: a_mesurer
        parce_que: >
          à CONSTATER, pas à mesurer : il suffit de demander au cousin
          quel est son moyen de découpe.
