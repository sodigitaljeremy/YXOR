# Étude de YXOR Kit — HYPOTHÈSES de calcul, lues par scripts/kit.py
#
# Créé le 2026-10-08 (prompt « Étude de YXOR Kit »). Ce qui est DÉCIDÉ est
# dans la fiche 0074 (Jeremy, 2026-10-08) : modules successifs ; mêmes
# dimensions, taille et composants que le Lab ; carton ; outils du ménage.
# TOUT CE QUI SUIT EST PROPOSÉ (Claude), à confirmer par Jeremy. Les modules
# eux-mêmes sont dans params/capacites.yaml (profils.kit.modules).
#
# Aucune cote en dur (règle 1) : les longueurs sont des ratios × H ; les
# sections viennent du squelette (params/squelette.yaml) ou de
# l'encombrement d'un servo (quincaillerie, règle 2).

# LE LAB TEL QUE L'EXPLORATEUR LE DONNE AUJOURD'HUI : la meilleure solution RobStride en 12S, 250 Hz, coupure
# 3,0 V, chaîne compacte (docs/explorateur-lab-2026-10.md, ensemble 27), APRÈS la fiche 0075 (Feetech aux petits
# axes). Ce sont des SORTIES d'un calcul de 8 min, RECOPIÉES ici : tests/test_kit.py vérifie qu'elles figurent
# toujours dans le rapport de l'explorateur, et échoue s'il change. La taille du Lab n'est PAS décidée (fiche 0047).
lab:
  source: "docs/explorateur-lab-2026-10.md, § 12S, 250 Hz, coupure 3,0 V, chaîne compacte, ensemble 27 (après la fiche 0075)"
  ligne: "| 27 | 0,85 → 0,850 | robstride + feetech | 18,5 | ≥ 4 514 | — | INR-21700-P50B 12S2P, 420 Wh, 2,22 kg | Seeed reComputer Mini J3011 (Orin Nano 8 GB inclus) |"
  H_m: 0.85
  hauteur_reelle_m: 0.850
  masse_kg: 18.5
  cellule: molicel_p50b      # INR-21700-P50B, pack 12S2P
  petits_axes: feetech       # fiche 0075

# TAILLE DU KIT : GELÉE, PROPOSÉ (2026-10-08), en attendant Jeremy. Le Kit doit avoir la taille du Lab (fiche 0074),
# mais la contrainte Feetech (fiche 0075) a fait passer le Lab de 0,715 à 0,850 m : à H = 0,65 m, le genou (RS06)
# tenait le couple continu à 0,07 N·m près (11,07 exigés, 11,0 publiés, marge 1,5 comprise), et les ~150 g des
# Feetech (55 g au lieu de 18 g par petit axe) l'ont fait basculer dans le cas de masse le plus défavorable.
# Les plans du niveau 0 et l'étude restent à la taille d'avant ; Jeremy tranche (suivre le Lab à 0,85 m, ou non).
kit_taille:
  source: "meilleure solution du Lab AVANT la fiche 0075 (explorateur du 2026-10-08, petits axes Dynamixel) : 0,65 → 0,715 m, 13,6 kg"
  H_m: 0.65                  # hauteur de la jambe (les couples se lisent à la jambe réelle)
  hauteur_reelle_m: 0.715    # seul le tronc s'allonge (électronique), lot 4a septies

structure:
  # Les coques du Kit sont dimensionnées dès le niveau 0 pour loger les servos du niveau 3 : un module
  # s'AJOUTE, il ne fait pas refaire la structure (fiche 0074).
  facteur_renforts: 1.5      # PROPOSÉ : rabats, cloisons, doubles épaisseurs aux pivots (× l'aire des coques)
  segments_a_servo: [bassin, tronc, cuisse, tibia, bras, avant_bras]   # section ≥ servo + deux parois
  profondeur_tronc: profondeur_poitrine   # ratio ANSUR (et pas la boîte simplifiée du squelette) : le Lab y loge
                                          # son électronique (explorateur, place dans le tronc)
  carton_reference: carton_ondule_double  # la seule matière MESURÉE du projet (mesures.yaml, 2026-09-29)
  # Le tronc du Kit a la longueur de celui du Lab : tronc_hauteur × H + (hauteur réelle − H) (seul le tronc
  # s'allonge, lot 4a septies). Même silhouette, même place pour la même électronique.

# Tenir debout (niveau 3), en statique : genoux légèrement fléchis, hanche à l'aplomb de la cheville.
debout:
  inclinaison_tibia_deg: 10  # PROPOSÉ ; genou : M·g/2 × tibia·sin α ; hanche : même bras de levier (majorant) ;
                             # cheville : M·g/2 × moitié du pied (exigences_physiques, levier_cheville_frac)

# Où chaque servo motorisé est porté (pour les couples statiques et la répartition des masses).
statique:
  # Bras tendu à l'horizontale : le cas STATIQUE le plus défavorable de l'épaule et du coude.
  # Tête basculée de 90° : le plus défavorable du cou (bras de levier : cou + demi-tête).
  bras_horizontal: true
  tete_basculee_deg: 90

servos:
  famille: feetech
  # Option « alignée sur le Lab » : les servos sur un rail 12 V régulé (le rail 12 V du Lab, puissance.yaml,
  # rails), depuis le pack 12S du Lab. Option « minimale » : servos directement sur un pack 3S.
  rail_V: 12

alimentation:
  aligne_lab:
    description: "pack 12S1P de la cellule du Lab (la moitié de son pack 12S2P), rail 12 V par convertisseur"
    S: 12
    P: 1
    cellule: lab
    calculateur: "+ vision et voix"   # le niveau 2 ; acheté dès le niveau 1, sans rien remplacer ensuite
  minimale:
    description: "pack 3S1P en 21700, servos sur le pack, Raspberry Pi 5 (5 V par convertisseur)"
    S: 3
    P: 1
    cellule: la_plus_legere
    calculateur_id: rpi5_8gb          # 8 GB : le critère « + vision et voix » (puissance.yaml, niveaux_ia)
    carte_ia_id: rpi_ai_hat_plus_13   # accélérateur de vision ; voix : sur le processeur (non vérifié)

  progressive:
    # DÉCIDÉE par Jeremy (fiche 0075, 2026-10-08) : « chaque composant du Lab n'est acheté qu'au niveau qui en a
    # besoin, avec un bloc secteur 12 V aux niveaux 1 et 2 et la batterie au niveau 3 seulement, dans un boîtier
    # ignifuge ». Le dimensionnement ci-dessous est PROPOSÉ.
    description: "bloc secteur 12 V aux niveaux 1 et 2 ; au niveau 3, pack 12S1P de la cellule du Lab, sa chaîne et son rail 12 V, dans un contenant ignifuge"
    S: 12
    P: 1
    cellule: lab
    calculateur: "+ vision et voix"
    secteur_niveaux: [1, 2]
    batterie_niveau: 3
    marge_courant_secteur: 1.25        # PROPOSÉ : au-delà du pire cas (tous les servos au blocage + calculateur au max)
    bloc_ferme: true                   # PROPOSÉ (ménage) : un adaptateur de table fermé, aucune borne 230 V à raccorder

# Courant de blocage par servo (params/kit_marche.yaml, courants_feetech) : quel relevé correspond à quel id.
courant_blocage_releve:
  sts3215_c018: "C018"
  sts3250: "STS3250"
  sts3215_c001: "C001"

# Composants du niveau 2 sans marché relevé : ils restent null (prix et masse) et sont DITS.
interactif_sans_marche: [camera, microphone, haut_parleur, ecran_visage]

# Classement des cartons (point 2 du prompt) : critères PROPOSÉS, à arbitrer par Jeremy. Le meilleur selon
# ces critères est CALCULÉ par scripts/kit.py (classement_cartons) ; rien n'est décidé.
cartons:
  eliminatoires:
    # « filière papier, mono-matière » : docs/vision-produit.md (PROPOSÉ) « éviter les mélanges de matières
    # collées » ; un sandwich mousse/carton (Kapa) ou un plastique (Forex, PP) n'y va pas.
    familles_papier: [ondule_simple, ondule_double, gris_compact, nid_abeille]
    papier_hors_famille: [siebdruckkarton_finnboard_2mm_modulor]   # carton contrecollé, rangé en « autre »
    # disponible en Suisse : vendeur suisse ou livraison en Suisse (un champ `dispo_suisse` qui commence par
    # « non » élimine) ; un ondulé SIMPLE FACE (une face plate seulement) n'est pas un panneau : éliminé.
    simple_face: [ondule_b_simple_face_rouleau_udobaer, ondule_simple_face_opo]
  # Rang, dans l'ordre : (1) rigidité en flexion PAR MASSE, approchée par e² / masse surfacique (un panneau
  # creux ou sandwich : rigidité ∝ e², masse ∝ masse surfacique) — PROXY PROPOSÉ, que les essais du protocole
  # remplaceront ; (2) masse de la structure du Kit ; (3) prix de la structure.
  # Un produit sans épaisseur ou sans masse surfacique lue est rangé « à peser » (protocole-carton.md).

# ═════════════════════════════════════════════════════════════════════════
#  NIVEAU 0 : plans à découper (parts/kit_niveau0.py) — PROPOSÉ
# ═════════════════════════════════════════════════════════════════════════
# Décidé (fiche 0075) : assemblage B (tenons et mortaises, colle non porteuse seulement, pivots par vis
# traversante). Matière : le prompt du 2026-10-08 fait dessiner en carton ondulé double, 3,5 mm (valeur mesurée,
# réglage cutter_cartonondule_double) ; ce n'est pas un choix écrit par Jeremy.
# Tout ce qui suit est une HYPOTHÈSE DE DESSIN, à corriger après le premier montage.
niveau0:
  reglage: cutter_cartonondule_double
  servo: sts3215               # hardware.yaml, servos : logements prévus dès le niveau 0
  vis_pivot: M4                # hardware.yaml, vis
  jeu_fenetre: 1.0             # mm, ajouté à A et B (découpe à la main, ±0,5 par bord)
  jeu_mortaise: 0.5            # mm, ajouté à la longueur d'une mortaise
  tenon_longueur: 12.0         # mm
  pas_tenons: 45.0             # mm, au plus, entre deux tenons d'un même bord
  voile_facteur: 2.0           # voile = 2 × épaisseur (bande de matière minimale près d'un bord ou d'une fente)
  cales_palonnier: 2           # rondelles de carton côté servo : 2 × 3,5 = 7 mm ≈ saillie 3,4 + palonnier
  jeu_pivot: 1.0               # mm, côté opposé au servo (une rondelle métallique)
  cale_diametre: 16.0          # mm, rondelles de carton
  recouvrement_plaque: 6.0     # mm, plaque de serrage intérieure au-delà de la fenêtre (niveau 0)
  profondeur_plaque_logement: 0.5   # × C : plaque à fenêtre intérieure, à mi-hauteur du servo
  pied_talon: 0.25             # la cheville au quart de la longueur du pied, depuis le talon
  recouvrement_tuiles: 10.0    # mm, recouvrement de deux feuilles d'une grande pièce
  longueurs_vis: [12, 16, 20, 25, 30, 35, 40]   # mm, longueurs courantes du commerce (non vérifiées sur une norme)
  facteur_chutes: 1.5          # PROPOSÉ : carton à réunir = aire des pièces × 1,5 (chutes, ratés, cartons de récupération irréguliers)
