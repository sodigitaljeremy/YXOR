# historique git de ce fichier, et l'étiquette avant-refonte-2026-10-01.
# Depuis la fiche 0065, le banc VÉRIFIE le RS00 ; sa composition reste
# NON DÉCIDÉE.

banc:
  statut: "composition NON DÉCIDÉE"
  # MODIFIÉ le 2026-10-01 (refonte R6) : les configurations qui ne servent
  # plus sont retirées (qualification à trois modèles, feetech, rs05_x2,
