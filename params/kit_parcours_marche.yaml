# Parcours du Kit : relevé de sources du 2026-10-11 (agent ; sources marche_parc_* au registre ; null si non lu ;
# la plus prudente de deux valeurs, fiche 0064). Lu par scripts/kit_parcours.py. Aucune décision, aucun achat.
# ⚠ Reachy Mini : matériel en « CC BY-SA-NC » selon son README (non commercial, comme ToddlerBot) ; démonstrations de
#   marche/roulage NON vérifiées (vidéos non visionnées) ; aucune bride de marque reconnue, aucune cote de bride.
rotation_continue:
- servo: Feetech STS3215 (série STS/SMS)
  existe: true
  nom_du_mode: 'mode 1 : « Constant speed mode » (恒速模式 / WheelMode dans le SDK Feetech ; VELOCITY dans LeRobot)'
  registre: Operating_Mode (« 运行模式 »)
  adresse: 33
  valeur_rotation_continue: 1
  autres_valeurs:
    0: position
    2: PWM boucle ouverte
    3: pas à pas (multitour ±7 tours selon le wiki Waveshare)
  consigne_vitesse:
    registre: Goal_Velocity / « Operating Speed »
    adresse: 46
    unite: 0,732 tr/min par pas (ou 0,0146 tr/min selon le bit 2 de la phase)
  vitesse_max_en_mode_1: null
  vitesse_a_vide_publiee:
    valeur: 0,222 s/60° (45 tr/min) à 12 V
    variante: ST3215 12 V (Waveshare)
    autres_lectures:
    - 0,16 s/60° à 6,0 V (Eckstein, STS3215 7,4 V C046 ; fiche truffée d'erreurs, voir rapport)
    - réglage max ~3073 pas/s ; 50 pas/s ≈ 0,732 tr/min (wiki Waveshare, carte de commande)
  position_lue_en_mode_1: true
  position_lue_detail: 'Present_Position (adr. 56, 0x38) décrit comme « current absolute position », l''exception
    citée étant le mode 3 (pas à pas) qui renvoie un écart. Bit 4 de la phase : retour d''angle monotour (0) ou
    pleine plage (1). Le wiki Waveshare liste « Feedback: Position, Load, Speed, Input Voltage » sans restriction
    de mode. Source tierce (AIFITLAB), pas la notice Feetech d''origine : à confirmer au banc.

    '
  usage_demontre: 'LeKiwi (LeRobot) : 3 STS3215 de roues réglés en OperatingMode.VELOCITY (lekiwi.py)'
  sources:
  - champ: adresse/valeur/nom (SDK officiel)
    via: direct
    source: marche_parc_ftservo_h
  - champ: WheelMode = écrire 1 à l'adresse 33
    via: direct
    source: marche_parc_ftservo_cpp
  - champ: OperatingMode 0-3
    via: direct
    source: marche_parc_lerobot_feetech
  - champ: Operating_Mode (33,1), Goal_Velocity (46,2), Present_Position (56,2), Present_Velocity (58,2), résolution
      4096
    via: direct
    source: marche_parc_lerobot_tables
  - champ: usage_demontre
    via: direct
    source: marche_parc_lerobot_lekiwi
  - champ: 'table mémoire : description modes, adr. 46 et 56, bits de phase'
    via: direct
    source: marche_parc_aifitlab_sts
  - champ: vitesse à vide 45 tr/min @12V, « motor mode continuous rotation », réglage max ~3073
    via: direct
    source: marche_parc_waveshare_st3215
  - champ: quatre modes 0-3 ; 0,16 s/60° @6 V
    via: direct
    source: marche_parc_eckstein_sts3215
  resume: 'existe : mode 1 « Constant speed » (WheelMode), registre Operating_Mode adresse 33, valeur 1, consigne
    de vitesse adresse 46 ; vitesse maximale propre au mode 1 NON publiée (null) ; lecture de la position en mode
    1 : une source tierce seulement (à vérifier au banc)'
