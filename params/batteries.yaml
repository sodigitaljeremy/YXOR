# Marché des batteries — lu par scripts/marche_composants.py
#
# DONNÉES SEULEMENT (2026-10-07) : aucune intégration à l'explorateur, aucun achat (fiche 0066).
# Contexte DÉCIDÉ (fiche 0070, Jeremy, 2026-10-07) : « Les deux robots, YXOR Lab et YXOR, fonctionnent
# entièrement sur batterie. Je préfère NVIDIA Jetson, mais je veux une comparaison chiffrée avec le
# Raspberry Pi 5 et ses cartes d'IA. »
#
# Même méthode que le marché des actionneurs : une valeur non lue est null ; deux sources qui divergent,
# la plus prudente (fiche 0064), l'autre en note. Relevé par quatre agents de Claude Code le 2026-10-07 ;
# chaque source est TÉLÉCHARGÉE (hors du dépôt) et inscrite au registre params/fournisseurs.yaml sous
# la clé citée ici (marche_<domaine>_<id>), redistribuable: false. Les valeurs dérivées (énergie non
# publiée, volume, densités, CHF HT, TOPS/W, canaux CAN) sont CALCULÉES par scripts/marche_composants.py,
# jamais déclarées ici.

chimies:
  li_ion:
    tension_nominale_V:
      valeur: 3.6
      unite: V
      source: marche_bat_ds_molicel_p45b
      page: p. 1
      note: 'idem Samsung, Murata, EVE, LG HG2 ; LG MJ1 3,635 V, M58T 3,59 V, M50LT 3,69 V : 3,6 V retenu, le plus
        prudent hors M58T (3,59)'
    tension_max_V:
      valeur: 4.2
      unite: V
      source: marche_bat_ds_molicel_p45b
      page: p. 1
      note: toutes les fiches lues ; maximum absolu 4,25 V chez Murata et LG
    tension_min_V:
      valeur: 2.5
      unite: V
      source: marche_bat_ds_molicel_p45b
      page: p. 1
      note: Samsung 35E coupe à 2,65 V (ds_samsung_35e p. 3) ; Murata VTC5A/VTC6 descendent à 2,0 V, LG protège
        à 2,0 V. Pour l'énergie utilisable, 2,65 V serait la plus prudente sur la 35E seulement
  lifepo4:
    tension_nominale_V:
      valeur: 3.2
      unite: V
      source: marche_bat_ds_powersonic_ifr18650ec
      page: p. 1
      note: K2 et SoliCELL 3,2 V ; A123 3,3 V (ds_a123_anr26650 p. 1)
    tension_max_V:
      valeur: 3.65
      unite: V
      source: marche_bat_ds_powersonic_ifr18650ec
      page: p. 1
      note: K2 3,65 V, SoliCELL 3,65 ± 0,03 V ; A123 charge à 3,6 V ; maximum absolu 3,7 V chez Power-Sonic
    tension_min_V:
      valeur: 2.5
      unite: V
      source: marche_bat_ds_powersonic_ifr18650ec
      page: p. 1
      note: recommandée ; K2 2,5 V ; SoliCELL 2,0 V ; limite absolue 2,0 V chez Power-Sonic et K2
  lipo:
    tension_nominale_V:
      valeur: 3.7
      unite: V
      source: marche_bat_ds_pkcell_lipo
      page: p. 2
      note: une seule fiche LiPo lue (petite cellule 500 mAh) ; à confirmer sur une cellule LiPo de puissance
    tension_max_V:
      valeur: 4.2
      unite: V
      source: marche_bat_ds_pkcell_lipo
      page: p. 2
    tension_min_V:
      valeur: 3.0
      unite: V
      source: marche_bat_ds_pkcell_lipo
      page: p. 2
      note: coupure 3,0 V, plus haute que les 2,5 V des cellules cylindriques
regles_envoi_ch:
  poste_ch_national:
    transporteur: La Poste suisse (colis national)
    resume: 'Batteries lithium-ion « leistungsschwach » (disposition spéciale 188 de l''ADR) admises au colis :
      cellule ≤ 20 Wh, batterie ≤ 100 Wh ; UN 3480 (seules) / UN 3481 (dans ou avec un équipement). Emballage intérieur
      non conducteur, protection contre le court-circuit, emballage extérieur résistant ; marque lithium 100 × 100
      mm (ou 100 × 70) avec le numéro UN ; dispense de marque pour ≤ 4 cellules ou ≤ 2 batteries installées dans
      un équipement par colis (2 colis max. par destinataire) ; colis ≤ 30 kg brut. Interdites : batteries > 100
      Wh (ex. batteries de vélo électrique) et batteries endommagées. UN 38.3 n''est pas cité dans les passages
      lus.'
    source: marche_bat_post_handbuch
    page: p. 5 (interdits) ; p. 11-13 (§4.2.3)
    source_2: post_national (« Lithium batteries up to 100 Wh » admis, batteries défectueuses et de vélo électrique
      interdites)
    note: règles du transport INTÉRIEUR suisse ; un envoi venant de l'UE dépend du transporteur expéditeur et des
      règles internationales
  poste_ch_international:
    transporteur: La Poste suisse (international)
    resume: 'La page « International dangerous goods » cite les batteries lithium mais son tableau détaillé n''est
      pas présent dans le HTML téléchargé. Limites internationales : null (non lues dans un fichier). À relire sur
      la page dans un navigateur.'
    source: marche_bat_post_international
  dhl_express:
    transporteur: DHL Express (aérien, IATA DGR)
    resume: 'Li-ion seules (UN 3480, PI 965) : seulement en section IA/IB, état de charge ≤ 30 %, avion cargo uniquement
      (CAO), compte agréé, code de service « HE », service limité ; > 20 Wh par cellule ou > 100 Wh par batterie
      : section IA avec emballage homologué ONU, 35 kg max. (CAO). Emballées avec un équipement (UN 3481, PI 966
      section II) : ≤ 20 Wh par cellule, ≤ 100 Wh par batterie, 5 kg max. de batteries par colis, code « HD », compte
      agréé. Installées dans un équipement (PI 967 section II) : ≤ 2 batteries ou 4 cellules par colis et ≤ 2 colis
      par envoi sans code de service ; au-delà, code « HV ». Les sections I (PI 965 IA, 966/967 I) ne sont pas acceptées
      en Time Definite International par la route depuis ou vers un État ADR. Batteries rappelées ou défectueuses
      interdites en aérien. UN 38.3 n''est pas cité dans ce document.'
    source: marche_bat_dhl_liion
    page: p. 1
    note: 'version 5.7 en vigueur au 2022-01-01, fondée sur l''IATA DGR 2022 : peut avoir changé (IATA DGR 2026)
      ; à revérifier avant tout envoi'
  nkon:
    transporteur: NKON (expéditeur, NL)
    resume: Les clients hors UE sont renvoyés vers une boutique séparée (ru.nkon.nl) pour commander et être livrés
      sans TVA. Envoi par poste ordinaire ou DPD ; le colis postal est limité aux commandes de 2 kg ; frais de 3
      à 50 EUR ; délai moyen d'environ 4 jours en Europe, jusqu'à 3 semaines. La page ne dit rien des règles lithium
      ni de la Suisse en particulier. Les CGV interdisent de renvoyer un produit lithium endommagé, fuyant, gonflé
      ou chaud sans instructions.
    source: marche_bat_nkon_envoi
    note: 'CGV : nkon_cgv'
  akkuteile:
    transporteur: akkuteile.de (expéditeur, DE)
    resume: 'Expédition DHL ; international : 13,90 EUR jusqu''à 5 kg, 16,90 (5–10 kg), 24,90 (10–20 kg), 32,90
      (20–30 kg) TTC. La Suisse (CH) figure dans la liste des pays de livraison de la page (données de configuration).
      La page ne dit rien des règles lithium ni de la TVA/douane suisse.'
    source: marche_bat_ak_envoi
