  protection:
  - marque: DeWalt
    coupure_dans: outil
    surintensite_dans: outil
    detail: 'Démontage publié (packs 20V MAX 3.0 Ah et 6.0 Ah, marché US) : bornes reliées en permanence aux cellules,
      aucune coupure en tension basse ni en surintensité dans le pack, « the tool is required to handle all that
      ». La carte du pack équilibre et porte une thermistance. Le DCB184 européen (18V XR) n''a PAS été démonté
      dans ces sources.'
    contradiction: done.land coche « Built-in BMS ✅ » pour « DeWalt XR 18V/20V Max 5Ah », sans dire ce que le BMS
      coupe. La fiche DCB184 dit « Protection against overheat, overload and deep discharge » sans dire où.
    sources:
    - champ: coupure et surintensite dans l'outil (pack 6.0 Ah)
      via: direct
      source: marche_nrj_sevarg_dewalt_6ah
    - champ: bornes reliees en permanence, coupure par l'outil (pack 3.0 Ah)
      via: direct
      source: marche_nrj_sevarg_dewalt_3ah
    - champ: tableau Built-in BMS (contradiction)
      via: direct
      source: marche_nrj_doneland_toolbatteries
    - champ: texte fabricant protection
      via: direct
      source: marche_nrj_dewalt_dcb184_cef
  - marque: Makita
    coupure_dans: outil (sur signal de la batterie)
    surintensite_dans: outil (sur signal de la batterie)
    detail: 'Fabricant : « STAR Protection » = communication batterie-outil en temps réel ; batterie « compatible
      only with Star Protection tools ». Notice DDF485 : « The tool is equipped with a tool/battery protection system.
      This system automatically cuts off power to the motor » (surcharge, surchauffe, décharge profonde). Aucun
      démontage lu ne dit si la batterie possède aussi un interrupteur de puissance interne.'
    sources:
    - champ: STAR Protection, compatibilite outils
      via: jina
      source: marche_nrj_makita_bl1850b_com
    - champ: l'outil coupe le moteur
      via: direct
      source: marche_nrj_makita_ddf485_manuel
  - marque: Bosch Professional
    coupure_dans: null
    surintensite_dans: null
    detail: 'Notice GSR 18V-55 : « When the battery is discharged, the power tool is switched off by means of a
      protective circuit » (ECP). Page ECP : « The tool is shut down if the battery pack is put under excessive
      load ». L''emplacement du circuit (batterie ou outil) n''est PAS dit : null.'
    sources:
    - champ: ECP, arret de l'outil par circuit de protection
      via: direct
      source: marche_nrj_bosch_gsr18v55_manuel
    - champ: ECP surcharge, surchauffe, decharge profonde
      via: direct
      source: marche_nrj_bosch_ecp_au
